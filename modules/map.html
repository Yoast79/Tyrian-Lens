		async function fetchCompletedAchievements() {
			const activeKey = localStorage.getItem('gw2_active_key');
			if (!activeKey) {
				console.log("[Masteries] No active key found, skipping completed check.");
				return;
			}
			try {
				const response = await fetch("https://api.guildwars2.com/v2/account/achievements?access_token=" + activeKey);
				if (response.ok) {
					const data = await response.json();
					completedAchievements = new Set(
						data.filter(item => item.done === true || (item.current && item.max && item.current >= item.max)).map(item => item.id)
					);
					console.log(`[Masteries] Loaded ${completedAchievements.size} completed achievements.`);
				}
			} catch (e) {
				console.error("[Masteries] Failed to fetch achievements:", e);
			}
		}

		function renderMasteryInsights() {
			if (!subLayers['mastery']) {
				subLayers['mastery'] = L.markerClusterGroup({ disableClusteringAtZoom: 6, maxClusterRadius: 40, showCoverageOnHover: false, iconCreateFunction: createClusterIcon });
			}
			subLayers['mastery'].clearLayers();
			
			if (!masteryPointsData) return;
			
			const hideCompleted = localStorage.getItem('gw2_hide_completed_mastery') === 'true';
			const points = Array.isArray(masteryPointsData) ? masteryPointsData : (masteryPointsData.points || []);
			
			points.forEach(p => {
				const achId = p.achievement_id || p.achievementId;
				const isCompleted = achId && completedAchievements.has(parseInt(achId));
				
				if (isCompleted && hideCompleted) {
					return; // Skip rendering completed points entirely!
				}
				
				let pName = p.node || p.name || "Mastery Insight";
				let exp = (p.expac || "").toLowerCase();
				let iconPath = "https://gw2ps.local/Assets/Icons/mi_tyria.png";
				if (exp === "hot" || pName.includes("(HoT)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_hot.png";
				else if (exp === "pof" || pName.includes("(PoF)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_pof.png";
				else if (exp === "ibs" || pName.includes("(IBS)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_ibs.png";
				else if (exp === "voe" || pName.includes("(VoE)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_voe.png";
				else if (exp === "eod" || pName.includes("(EoD)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_eod.png";
				else if (exp === "jw" || pName.includes("(JW)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_jw.png";
				else if (exp === "soto" || pName.includes("(SotO)")) iconPath = "https://gw2ps.local/Assets/Icons/mi_soto.png";

				let customIcon;
				if (isCompleted) {
					const scale = locScale;
					const size = 24 * scale;
					const anchor = 12 * scale;
					const checkSize = 12 * scale;
					
					const markerHtml = `
						<div style="position: relative; width: ${size}px; height: ${size}px; overflow: visible !important;">
							<img src="${iconPath}" style="width: ${size}px; height: ${size}px; display: block;" />
							<img src="https://gw2ps.local/Assets/Icons/fish_caught.png" style="position: absolute; top: -3px; right: -3px; width: ${checkSize}px; height: ${checkSize}px; z-index: 1000; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8));" />
						</div>`;
					
					customIcon = L.divIcon({
						html: markerHtml,
						className: 'layer-target-mastery completed-mastery',
						iconSize: [size, size],
						iconAnchor: [anchor, anchor]
					});
				} else {
					customIcon = L.icon({
						iconUrl: iconPath,
						iconSize: [24 * locScale, 24 * locScale],
						iconAnchor: [12 * locScale, 12 * locScale],
						className: 'layer-target-mastery'
					});
				}

				let m = L.marker([parseFloat(p.pos[1]), parseFloat(p.pos[0])], { pane: 'iconPane', interactive: true, icon: customIcon, data: p });
				m.on('mouseover', e => { 
					var pt = map.mouseEventToContainerPoint(e.originalEvent); 
					let tooltipHtml = `<b>Mastery Insight</b>`;
					if (p.desc) {
						tooltipHtml += `<br><span style="color:#8a7a5f; font-size:11px; text-transform:none;">${p.desc}</span>`;
					}
					window.parent.postMessage({ action: 'showTooltip', text: tooltipHtml, x: pt.x, y: pt.y, offsetTop: 45 }, "*"); 
				});
				m.on('mouseout', () => window.parent.postMessage({ action: 'hideTooltip' }, "*"));
				let cCode = p.chat_code || p.chat_link;
				if (cCode && cCode.trim() !== "") m.on('click', () => { navigator.clipboard.writeText(cCode); window.parent.postMessage({ action: 'toast', msg: 'CHATLINK COPIED' }, "*"); });

				m.addTo(subLayers['mastery']);
			});
			
			if (isLayerEnabled('mastery')) {
				map.addLayer(subLayers['mastery']);
			} else {
				map.removeLayer(subLayers['mastery']);
			}
		}

		window.toggleHideCompletedMastery = function (isHidden) {
			renderMasteryInsights();
		};

		async function init() {
			await fetchCompletedAchievements();
			customMarkersLayer.clearLayers();
			borderLayer.clearLayers();
			Object.values(layerMap).forEach(l => { l.clearLayers(); map.removeLayer(l); });
			Object.values(subLayers).forEach(l => { l.clearLayers(); map.removeLayer(l); });

			let tempSettings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
			let highlightColors = JSON.parse(localStorage.getItem('gw2_highlight_colors') || '{}');
			if (!highlightColors['map_borders'] && tempSettings.borderColor) {
				highlightColors['map_borders'] = tempSettings.borderColor;
			}
			applyIconHighlights(highlightColors);

			loadCustomMarkers();
			loadFlowingBorders();

			try {
				let settings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
				Object.keys(settings).forEach(key => { layerToggles[key] = settings[key]; });

				let markerSettings = JSON.parse(localStorage.getItem('gw2_marker_settings') || '{}');
				Object.keys(markerSettings).forEach(key => { layerToggles[key] = markerSettings[key]; });

				let masterToggles = JSON.parse(localStorage.getItem('gw2_master_toggles') || '{}');
				if (masterToggles['farming_nodes'] !== undefined) {
					layerToggles['farming_nodes'] = masterToggles['farming_nodes'];
				} else {
					layerToggles['farming_nodes'] = true;
				}

				const altFiles = [
					"nodes_wood.json", "nodes_achievements.json", "nodes_chests.json", 
					"nodes_map_specific.json", "nodes_ore.json", "nodes_plants.json",
					"nodes_bounty.json", "nodes_festivals.json", "nodes_fishing.json",
					"nodes_miscellaneous.json", "nodes_mist_rift.json", "nodes_ranger_pets.json",
					"nodes_service_npc.json", "nodes_world_events.json"
				];
				const altPromises = altFiles.map(file => fetch(apiBase + file + "?t=" + Date.now())
					.then(res => {
						if (res.ok) {
							return res.json().then(data => {
								console.log(`[Altitude Engine] Loaded ${file} successfully: ${data.length} nodes.`);
								// Inject the source file name into each node for dynamic dev mode updates!
								data.forEach(node => { node.sourceFile = file; });
								return data;
							}).catch(err => {
								console.error(`[Altitude Engine] Error parsing ${file} JSON:`, err);
								return [];
							});
						} else {
							console.error(`[Altitude Engine] Failed to load ${file}: HTTP status ${res.status}`);
							return [];
						}
					})
					.catch(err => {
						console.error(`[Altitude Engine] Network error fetching ${file}:`, err);
						return [];
					})
				);

				const [mRes, iRes, oRes, ...altResults] = await Promise.all([
					fetch(apiBase + "map_data.json?t=" + Date.now()).catch(() => null),
					fetch(apiBase + "nodes_mastery_insight.json?t=" + Date.now()).catch(() => null),
					fetch(apiBase + "map_options_structure.json?t=" + Date.now()).catch(() => null),
					...altPromises
				]);

				if (oRes && oRes.ok) {
					try {
						const sections = await oRes.json();
						buildLayerToSectionMap(sections);
						console.log("[Altitude Engine] Dynamically built layerToSectionMap from options structure.");
					} catch(err) {
						console.error("[Altitude Engine] Error parsing map_options_structure.json:", err);
					}
				}

				altitudeNodesData = altResults.flat().filter(p => p && p.pos);
				console.log(`[Altitude Engine] Total active altitude nodes loaded: ${altitudeNodesData.length}`);

				if (isDevMode) {
					const hudStatus = document.getElementById("alt-hud-status");
					if (hudStatus) {
						hudStatus.innerText = `OK (${altitudeNodesData.length} NODES)`;
						hudStatus.style.color = "#00ff00";
					}
				}

				// Render all altitude nodes (wood, achievements, chests, ores, plants, vendors, bosses, etc.) globally in subLayers
				altitudeMarkersMap.clear();
				activeAltitudeIndicators.clear();

				const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
				const today = days[new Date().getUTCDay()];

				altitudeNodesData.forEach(p => {
					if (!p.pos || p.pos.length < 2) return;

					// Skip WvW (Continent 2) markers on overworld map
					if (p.continent && p.continent !== 1) return;
					// Skip daily rotation nodes that aren't for today
					if (p.day && p.day !== today) return;

					let layerKey = p.layer || p.type;
					
					// Core layer resolutions and mappings
					if (!layerKey && p.node) {
						let slug = p.node.toLowerCase().replace(/ñ/g, 'n').replace(/ /g, '_').replace(/[^a-z0-9_]/g, '');
						const mapping = {
							'rich_copper_vein': 'node_copper_ore',
							'rich_iron_vein': 'node_iron_ore',
							'rich_silver_vein': 'node_silver_ore',
							'rich_gold_vein': 'node_gold_ore',
							'rich_platinum_vein': 'node_platinum_ore',
							'dragon_pata': 'node_dragon_pinata',
							'dragon_piata': 'node_dragon_pinata'
						};
						layerKey = mapping[slug] || ("node_" + slug);
					}
					
					if (p.yields && p.yields.includes("Ranger Pet")) {
						layerKey = "node_ranger_pet";
					}
					
					// Dynamically distribute NPC services from service_npc split file
					if (layerKey === 'node_npc_services') {
						const service = (p.yields && p.yields[0]) ? p.yields[0] : '';
						layerKey = getNpcLayerKey(service);
					}

					// Skip WvW rifts or unconfigured layers
					if (!layerKey) return;

					if (!subLayers[layerKey]) {
						if (layerKey !== 'node_zone_portal') {
							subLayers[layerKey] = L.markerClusterGroup({
								disableClusteringAtZoom: 6, maxClusterRadius: 40, showCoverageOnHover: false,
								iconCreateFunction: createClusterIcon
							});
						} else {
							subLayers[layerKey] = L.layerGroup();
						}
					}

					let currentScale = farmingScaleNodes.includes(layerKey) ? farmScale : locScale;
					let baseSize = (layerKey === 'node_pact_supply_network_agent') ? 32 : (layerKey === 'node_ranger_pet') ? 45 : (layerKey === 'node_fishing_hole') ? 32 : 24;
					let size = Math.round(baseSize * currentScale);
					let anchor = size / 2;
					let iconUrl = resolveIconUrl(p.icon);

					// Premium custom styled elements wrapped in altitude container
					let markerHtml = '';
					let customClass = 'altitude-div-icon layer-target-' + layerKey;
					if (layerKey === 'node_ranger_pet') {
						let slug = p.node ? p.node.toLowerCase().replace(/ñ/g, 'n').replace(/ /g, '_').replace(/[^a-z0-9_]/g, '') : '';
						customClass += ' pet-marker pet-' + slug;
						markerHtml = `<div class="altitude-marker-container" style="position: relative; width: ${size}px; height: ${size}px; overflow: visible !important;"><img src="${iconUrl}" style="width: 150% !important; height: 150% !important; border-radius: 50% !important; object-fit: cover !important; display: block !important;" /></div>`;
					} else if (layerKey === 'node_pact_supply_network_agent') {
						markerHtml = `<div class="altitude-marker-container" style="position: relative; width: ${size}px; height: ${size}px; overflow: visible !important;">
							<div class="psna-marker psna-highlight-active" style="width: ${size}px; height: ${size}px; border-radius: 50%; border: 2px solid #ffd700; background: rgba(10, 8, 5, 0.9); box-shadow: 0 0 10px #ffd700; display: flex; align-items: center; justify-content: center; overflow: hidden;">
								<img src="${iconUrl}" style="width: 80%; height: 80%; object-fit: contain;" />
							</div>
						</div>`;
					} else {
						markerHtml = `<div class="altitude-marker-container" style="position: relative; width: ${size}px; height: ${size}px; overflow: visible !important;"><img src="${iconUrl}" style="width: ${size}px !important; height: ${size}px !important; max-width: none !important; max-height: none !important; display: block !important;" /></div>`;
					}

					const customIcon = L.divIcon({
						html: markerHtml,
						className: customClass,
						iconSize: [size, size],
						iconAnchor: [anchor, anchor]
					});

					let m = L.marker([p.pos[1], p.pos[0]], {
						pane: 'iconPane',
						interactive: true,
						icon: customIcon,
						data: p
					});

					// Set up premium custom dual-row tooltips for service NPCs, and standard tooltips for others
					let tooltipText = p.day ? `${p.node} (${p.day.toUpperCase()})` : p.node;
					if (layerKey.startsWith('node_npc_') || layerKey === 'node_pact_supply_network_agent') {
						const service = (p.yields && p.yields[0]) ? p.yields[0] : '';
						tooltipText = `<div style="font-weight:bold;color:#e2c07d;font-size:13px;margin-bottom:2px;">${p.node}</div>`;
						if (service) tooltipText += `<div style="color:#8a7a5f;font-size:11px;">${service}</div>`;
						if (p.desc) tooltipText += `<div style="color:#8a8a8a;font-size:11px;margin-top:2px;text-transform:none;">${p.desc}</div>`;
					} else {
						if (p.desc) {
							tooltipText = `<div style="font-weight:bold;color:#e2c07d;font-size:13px;margin-bottom:2px;">${tooltipText}</div><div style="color:#8a7a5f;font-size:11px;text-transform:none;">${p.desc}</div>`;
						}
						if (p.no_underwater) tooltipText += ` <img src="${p.no_underwater}" style="width:16px;height:16px;vertical-align:middle;margin-left:5px;" />`;
					}

					m.on('mouseover', e => {
						var pt = map.mouseEventToContainerPoint(e.originalEvent);
						window.parent.postMessage({ action: 'showTooltip', text: tooltipText, x: pt.x, y: pt.y, offsetTop: 45 }, "*");
					});
					m.on('mouseout', () => window.parent.postMessage({ action: 'hideTooltip' }, "*"));

					// Set up actions
					if (layerKey.startsWith('node_npc_') || layerKey === 'node_pact_supply_network_agent') {
						m.on('click', () => {
							const wikiUrl = `https://wiki.guildwars2.com/index.php?title=${encodeURIComponent(p.node)}&useskin=vector#Items_offered`;
							window.parent.postMessage({ action: 'openWiki', url: wikiUrl }, '*');
						});
					} else if (p.chat_code) {
						m.on('click', () => {
							navigator.clipboard.writeText(p.chat_code);
							window.parent.postMessage({ action: 'toast', msg: 'WAYPOINT COPIED' }, "*");
						});
					}


					m.addTo(subLayers[layerKey]);

					const key = p.pos[0] + "_" + p.pos[1] + "_" + layerKey;
					altitudeMarkersMap.set(key, m);
				});

				// 1. Mastery Insights
				if (iRes && iRes.ok) {
					masteryPointsData = await iRes.json();
					renderMasteryInsights();
				}

				// 4. Standard Map Data (POIs, Labels, etc.)
				if (mRes && mRes.ok) {
					const data = await mRes.json();
					const typeMap = { 'landmark': 'poi', 'waypoint': 'waypoint', 'vista': 'vista', 'heart': 'heart', 'skill': 'heropoint', 'heropoint': 'heropoint', 'mastery': 'mastery' };
					const labelMapKeys = { 'region': 'region', 'map': 'map_text', 'sector': 'sector' };

					data.points.forEach(p => {
						let rawType = p.type.toLowerCase();
						let type = typeMap[rawType] || rawType;
						let labelKey = labelMapKeys[rawType];

						if (labelKey) {
							let l = L.marker([p.pos[1], p.pos[0]], {
								pane: 'textPane', interactive: true,
								icon: L.divIcon({ className: 'map-label ' + (labelKey === 'region' ? 'region-label' : labelKey === 'map_text' ? 'map-title-label' : 'sector-label'), html: p.name, iconSize: [400, 40] })
							});
							if (p.description || p.desc) {
								let tooltipHtml = `<div style="text-align: center; font-family: 'Crimson Text', serif; font-size: 13px; color: #e2c07d; line-height: 1.4; padding: 4px; max-width: 250px;">
									<div style="font-weight: bold; font-size: 15px; margin-bottom: 4px; letter-spacing: 1px; border-bottom: 1px solid #4a3b2a; padding-bottom: 2px; text-transform: uppercase;">${p.name}</div>
									<div style="color: #fff; font-size: 12px; text-transform: none;">${p.description || p.desc}</div>
								</div>`;
								l.on('mouseover', e => {
									var pt = map.mouseEventToContainerPoint(e.originalEvent);
									window.parent.postMessage({ action: 'showTooltip', text: tooltipHtml, x: pt.x, y: pt.y, offsetTop: 45 }, "*");
								});
								l.on('mouseout', () => window.parent.postMessage({ action: 'hideTooltip' }, "*"));
							} else if (labelKey === 'map_text') {
								l.on('mouseover', e => {
									let meta = buildMapMetaHtml(p);
									if (meta) {
										var pt = map.mouseEventToContainerPoint(e.originalEvent);
										window.parent.postMessage({ action: 'showTooltip', text: meta, x: pt.x, y: pt.y, offsetTop: 45 }, "*");
									}
								});
								l.on('mouseout', () => window.parent.postMessage({ action: 'hideTooltip' }, "*"));
							}
							l.addTo(layerMap[labelKey]);
						} else {
							if (!subLayers[type]) {
								if (type === 'node_zone_portal') {
									subLayers[type] = L.layerGroup();
								} else {
									subLayers[type] = L.markerClusterGroup({ disableClusteringAtZoom: 6, maxClusterRadius: 40, showCoverageOnHover: false, iconCreateFunction: createClusterIcon });
								}
							}
							let iconPath = p.icon || "https://gw2ps.local/Assets/Icons/poi_discovered.png";
							if (!p.icon) {
								if (type === 'waypoint') iconPath = "https://gw2ps.local/Assets/Icons/waypoint_discovered.png";
								else if (type === 'vista') iconPath = "https://gw2ps.local/Assets/Icons/vista_discovered.png";
								else if (type === 'heart') iconPath = "https://gw2ps.local/Assets/Icons/heart_discovered.png";
								else if (type === 'heropoint') iconPath = "https://gw2ps.local/Assets/Icons/heropoint_discovered.png";
							}

							let m = L.marker([p.pos[1], p.pos[0]], { pane: 'iconPane', interactive: true, icon: L.icon({ iconUrl: iconPath, iconSize: [24 * locScale, 24 * locScale], iconAnchor: [12 * locScale, 12 * locScale], className: 'layer-target-' + type }) });
							m.on('mouseover', e => {
								var pt = map.mouseEventToContainerPoint(e.originalEvent);
								let tooltipHtml = `<b>${p.name || "Map Point"}</b>`;
								if (p.description || p.desc) {
									tooltipHtml += `<br><span style="color:#8a7a5f; font-size:11px; text-transform:none;">${p.description || p.desc}</span>`;
								}
								window.parent.postMessage({ action: 'showTooltip', text: tooltipHtml, x: pt.x, y: pt.y, offsetTop: 45 }, "*");
							});
							m.on('mouseout', () => window.parent.postMessage({ action: 'hideTooltip' }, "*"));
							m.addTo(subLayers[type]);
						}
					});
				}

				// Finalize Visibility
				Object.keys(subLayers).forEach(key => {
					if (isLayerEnabled(key)) {
						map.addLayer(subLayers[key]);
					} else {
						map.removeLayer(subLayers[key]);
					}
				});
				refreshLabels();

				if (!isLayerEnabled('personal_markers')) map.removeLayer(customMarkersLayer);
				if (!isLayerEnabled('map_borders')) map.removeLayer(borderLayer);

				// Initialize Mistlock Sanctuary Clean Image Overlay
				const mistlockBounds = [[34304, 46848], [34816, 47616]];
				const mistlockOverlay = L.imageOverlay("https://gw2ps.local/Assets/Icons/mistlock_sanctuary_clean.png", mistlockBounds, { pane: 'mistlockPane' });
				mistlockOverlay.addTo(map);

				renderElisaMarker(); // Calculate and display Historian Elisa!

			} catch (e) {
				console.error(e);
			}
		}
		init();

		window.addEventListener("message", function (event) {
			if (event.data && event.data.action === 'toggleHideCompletedMastery') {
				window.toggleHideCompletedMastery(event.data.isHidden);
			}
			if (event.data && event.data.action === 'switchAccount') {
				fetchCompletedAchievements().then(() => renderMasteryInsights());
			}
			if (event.data && event.data.action === 'toggleMapLayer') {
				window.toggleMapLayer(event.data.name, event.data.isVisible);
			}
			if (event.data && event.data.action === 'jumpToLocation') {
				let x = event.data.x;
				let y = event.data.y;
				let layerKey = event.data.layerKey;
				if (layerKey === 'node_historian_elisa') {
					let activeWeek = getElisaActiveWeek();
					let elisaData = ELISA_ROTATION[activeWeek];
					if (elisaData) {
						x = elisaData.pos[1];
						y = elisaData.pos[0];
					}
				}
				if (x !== undefined && y !== undefined) {
					window.setTracking(false);
					map.setView([parseFloat(y), parseFloat(x)], 6);
				}
			}
			if (event.data && event.data.action === 'highlightLocation') {
				let x = event.data.x;
				let y = event.data.y;
				let isPet = event.data.isPet;
				let isFarmingNode = event.data.isFarmingNode;
				let markerIcon = event.data.markerIcon;
				let layerKey = event.data.layerKey;
				let markerName = event.data.markerName;
				
				if (layerKey === 'node_historian_elisa') {
					let activeWeek = getElisaActiveWeek();
					let elisaData = ELISA_ROTATION[activeWeek];
					if (elisaData) {
						x = elisaData.pos[1];
						y = elisaData.pos[0];
					}
				}
				
				// Clear any previous active highlight and temporary clone immediately
				if (activeHighlightTimeout) {
					clearTimeout(activeHighlightTimeout);
					activeHighlightTimeout = null;
				}
				if (activeHighlightMarker) { map.removeLayer(activeHighlightMarker); activeHighlightMarker = null; }
				if (activeTempIconMarker) { map.removeLayer(activeTempIconMarker); activeTempIconMarker = null; }
				
				if (x !== undefined && y !== undefined) {
					let posArr = [parseFloat(y), parseFloat(x)];
					
					// 1. Highlight Ring
					let markerClass = 'highlight-active';
					if (isPet) {
						markerClass = 'pet-marker highlight-active';
					} else if (isFarmingNode) {
						markerClass = 'highlight-node-active';
					}
					
					activeHighlightMarker = L.marker(posArr, {
						pane: 'highlightPane',
						icon: L.divIcon({
							className: markerClass,
							iconSize: [44, 44],
							iconAnchor: [22, 22],
							html: '<div style="width:100%;height:100%;"></div>'
						}),
						interactive: false
					}).addTo(map);
					
					// 2. Temporary Marker Clone (if the layer is not permanently shown)
					let tempIconMarker = null;
					let isPermanentlyShown = false;
					if (layerKey) {
						let type = layerKey === 'landmark' ? 'poi' : layerKey;
						if (subLayers[type] && map.hasLayer(subLayers[type])) {
							isPermanentlyShown = true;
						} else if (layerMap[type] && map.hasLayer(layerMap[type])) {
							isPermanentlyShown = true;
						} else if (layerToggles[type] === true) {
							isPermanentlyShown = true;
						}
					}
					
					if (!isPermanentlyShown && markerIcon) {
						let currentScale = locScale;
						let baseSize = (layerKey === 'node_major_detected_treasure') ? 48 : (layerKey === 'node_ranger_pet') ? 35 : (layerKey === 'node_fishing_hole') ? 32 : 24;
						
						let customIcon;
						if (isPet) {
							let slug = (markerName || '').toLowerCase().replace(/ñ/g, 'n').replace(/ /g, '_').replace(/[^a-z0-9_]/g, '');
							customIcon = L.divIcon({
								className: 'pet-marker pet-' + slug,
								iconSize: [baseSize * currentScale, baseSize * currentScale],
								iconAnchor: [(baseSize / 2) * currentScale, (baseSize / 2) * currentScale],
								html: `<img src="${markerIcon}" style="width:150% !important; height:150% !important; border-radius:50% !important; object-fit:cover !important;" />`
							});
						} else {
							customIcon = L.icon({
								iconUrl: markerIcon,
								iconSize: [baseSize * currentScale, baseSize * currentScale],
								iconAnchor: [(baseSize / 2) * currentScale, (baseSize / 2) * currentScale]
							});
						}
						
						let type = layerKey === 'landmark' ? 'poi' : layerKey;
						tempIconMarker = L.marker(posArr, {
							icon: customIcon,
							interactive: true,
							layerKey: type // Store type (e.g. 'poi', 'waypoint') on options for toggle cleanup
						}).addTo(map);
						if (markerName) {
							tempIconMarker.on('mouseover', e => {
								var pt = map.mouseEventToContainerPoint(e.originalEvent);
								window.parent.postMessage({ action: 'showTooltip', text: markerName, x: pt.x, y: pt.y, offsetTop: 45 }, "*");
							});
							tempIconMarker.on('mouseout', () => {
								window.parent.postMessage({ action: 'hideTooltip' }, "*");
							});
						}
						activeTempIconMarker = tempIconMarker;
					}
					
					activeHighlightTimeout = setTimeout(() => {
						if (activeHighlightMarker) { map.removeLayer(activeHighlightMarker); activeHighlightMarker = null; }
						if (activeTempIconMarker) { map.removeLayer(activeTempIconMarker); activeTempIconMarker = null; }
						activeHighlightTimeout = null;
					}, 60000);
				}
			}
			if (event.data && event.data.action === 'updateTheme') {
				document.body.setAttribute('data-theme', event.data.theme);
			}
			if (event.data && event.data.action === 'changeItemHighlightColor') {
				let highlightColors = JSON.parse(localStorage.getItem('gw2_highlight_colors') || '{}');
				if (event.data.color) {
					highlightColors[event.data.itemId] = event.data.color;
				} else {
					delete highlightColors[event.data.itemId];
				}
				localStorage.setItem('gw2_highlight_colors', JSON.stringify(highlightColors));
				applyIconHighlights(highlightColors);

				if (event.data.itemId === 'map_borders') {
					let newColor = event.data.color || '#4a3b2a';
					borderLayer.eachLayer(layer => {
						if (layer.setStyle) layer.setStyle({ color: newColor });
					});
				}
			}
			if (event.data && event.data.action === 'changeMapBorderColor') {
				let highlightColors = JSON.parse(localStorage.getItem('gw2_highlight_colors') || '{}');
				if (event.data.color) {
					highlightColors['map_borders'] = event.data.color;
				} else {
					delete highlightColors['map_borders'];
				}
				localStorage.setItem('gw2_highlight_colors', JSON.stringify(highlightColors));
				applyIconHighlights(highlightColors);

				let newColor = event.data.color || '#4a3b2a';
				borderLayer.eachLayer(layer => {
					if (layer.setStyle) layer.setStyle({ color: newColor });
				});
			}
			if (event.data && event.data.action === 'highlightLayer') {
				let layerName = event.data.layer;
				let petName = (event.data.markerName || "").trim().toLowerCase();
				if (!petName) return;

				// Determine if the layer was originally set to OFF in user settings
				let originallyOff = false;
				if (layerName) {
					let markerSettings = JSON.parse(localStorage.getItem('gw2_marker_settings') || '{}');
					let mapSettings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
					originallyOff = (markerSettings[layerName] !== true && mapSettings[layerName] !== true);
				}

				// Ensure target layer is temporarily visible for highlighting
				if (layerName && originallyOff) {
					window.toggleMapLayer(layerName, true);
				}

				let foundCount = 0;

				// Create temporary cluster group for highlights
				let highlightClusterGroup = L.markerClusterGroup({
					disableClusteringAtZoom: 6,
					maxClusterRadius: 40,
					showCoverageOnHover: false,
					clusterPane: 'highlightPane',
					iconCreateFunction: (cluster) => {
						let childMarkers = cluster.getAllChildMarkers();
						let markerClass = 'highlight-node-active';
						if (childMarkers.length > 0 && childMarkers[0].options.highlightClass) {
							markerClass = childMarkers[0].options.highlightClass;
						}
						
						let scale = (markerClass.includes('pet-marker')) ? farmScale : locScale;
						let baseSize = (markerClass.includes('pet-marker')) ? 52 : 36;
						let size = Math.round(baseSize * scale);
						let anchor = size / 2;

						return L.divIcon({
							className: markerClass,
							iconSize: [size, size],
							iconAnchor: [anchor, anchor],
							html: '<div style="width:100%;height:100%;"></div>'
						});
					}
				});

				if (layerName && layerName.startsWith('node_npc_')) {
					// Use the raw npcDataCache for Service NPCs
					npcDataCache.forEach(p => {
						if (!p.node || !p.pos) return;
						const yields = p.yields ? p.yields.map(y => y.trim().toLowerCase()) : [];
						const nodeName = p.node.trim().toLowerCase();

						if (yields.includes(petName) || nodeName === petName) {
							foundCount++;
							let posArr = [p.pos[0], p.pos[1]]; // [y, x] format for NPC coordinates
							
							let markerClass = 'psna-highlight-active'; // Pulsing gold highlight class for service NPCs

							let highlightMarker = L.marker(posArr, {
								pane: 'highlightPane',
								highlightClass: markerClass, // Store on options for iconCreateFunction
								icon: L.divIcon({
									className: markerClass,
									iconSize: [44, 44],
									iconAnchor: [22, 22],
									html: '<div style="width:100%;height:100%;"></div>'
								}),
								interactive: false
							});
							highlightClusterGroup.addLayer(highlightMarker);
						}
					});
				} else {
					// Use the raw markerDataCache for 100% accurate coordinate placement (Farming nodes/Pets)
					markerDataCache.forEach(p => {
						if (!p.node || !p.pos) return;
						let nodeName = p.node.trim().toLowerCase();

						if (nodeName.includes(petName)) {
							foundCount++;
							// Use the exact same coordinate array logic as the successful init() function
							let posArr = [p.pos[1], p.pos[0]];
							
							let isPet = layerName === 'node_ranger_pet' || nodeName.includes("juvenile");
							let markerClass = isPet ? 'pet-marker highlight-active' : 'highlight-node-active';

							let highlightMarker = L.marker(posArr, {
								pane: 'highlightPane',
								highlightClass: markerClass, // Store on options for iconCreateFunction
								icon: L.divIcon({
									className: markerClass,
									iconSize: [44, 44],
									iconAnchor: [22, 22],
									html: '<div style="width:100%;height:100%;"></div>'
								}),
								interactive: false
							});
							highlightClusterGroup.addLayer(highlightMarker);
						}
					});
				}

				if (foundCount > 0) {
					highlightClusterGroup.addTo(map);
					window.parent.postMessage({ action: 'toast', msg: `HIGHLIGHTED ${foundCount} "${petName.toUpperCase()}" LOCATIONS` }, '*');
					
					setTimeout(() => {
						map.removeLayer(highlightClusterGroup);
						highlightClusterGroup.clearLayers();
						
						// Only turn the layer OFF if the user has not manually enabled it during the highlighted session
						if (layerName && originallyOff) {
							let markerSettings = JSON.parse(localStorage.getItem('gw2_marker_settings') || '{}');
							let mapSettings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
							let currentToggleOn = (markerSettings[layerName] === true || mapSettings[layerName] === true);
							if (!currentToggleOn) {
								window.toggleMapLayer(layerName, false);
							}
						}
					}, 60000);
				} else {
					// Fallback search through DOM if cache failed or for non-farming markers
					document.querySelectorAll('.pet-marker').forEach(el => {
						if (el.className.toLowerCase().includes(petName.replace(/ /g, '_'))) {
							el.classList.add('highlight-active');
							foundCount++;
						}
					});
					if (foundCount > 0) {
						window.parent.postMessage({ action: 'toast', msg: `HIGHLIGHTED ${foundCount} VISIBLE ICONS` }, '*');
						setTimeout(() => {
							document.querySelectorAll('.highlight-active').forEach(el => el.classList.remove('highlight-active'));
							
							// Only turn the layer OFF if the user has not manually enabled it during the highlighted session
							if (layerName && originallyOff) {
								let markerSettings = JSON.parse(localStorage.getItem('gw2_marker_settings') || '{}');
								let mapSettings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
								let currentToggleOn = (markerSettings[layerName] === true || mapSettings[layerName] === true);
								if (!currentToggleOn) {
									window.toggleMapLayer(layerName, false);
								}
							}
						}, 60000);
					}
				}
			}
			if (event.data && event.data.action === 'updateTheme') {
				document.body.setAttribute('data-theme', event.data.theme);
			}
			if (event.data && event.data.action === 'toggleMenuState') {
				let isOpen = event.data.isOpen;
				let isWide = event.data.isWide;
				let newOffset = isOpen ? (isWide ? 290 : 160) : 0;
				let deltaX = newOffset - currentMenuOffset;
				currentMenuOffset = newOffset;

				if (isOpen) document.body.classList.add('menu-open');
				else document.body.classList.remove('menu-open');

				if (isTracking) {
					let lastPos = pMarker.getLatLng();
					window.updatePlayerLocation(lastPos.lng, lastPos.lat, 0, 0);
				} else {
					if (deltaX !== 0) {
						map.panBy([-deltaX, 0], { animate: true });
					}
				}
			}
			if (event.data && event.data.action === 'reloadMap') {
				init();
			}
			if (typeof event.data === 'string' && event.data.startsWith('ACTIVE_BOSSES:')) {
				let jsonStr = event.data.substring(14);
				try {
					let activeBosses = JSON.parse(jsonStr);
					if (subLayers['node_world_boss']) {
						subLayers['node_world_boss'].eachLayer(marker => {
							if (marker.options.bossName && activeBosses.includes(marker.options.bossName)) {
								if (marker._icon) marker._icon.classList.add('boss-active');
							} else {
								if (marker._icon) marker._icon.classList.remove('boss-active');
							}
						});
					}
				} catch (e) { }
			}
		});

		window.addEventListener('error', function(e) {
			console.error("Global JS Error caught:", e.error);
			window.parent.postMessage({ action: 'toast', msg: 'JS ERROR: ' + e.message, persistent: true }, "*");
		});
		window.addEventListener('unhandledrejection', function(e) {
			console.error("Unhandled Promise Rejection:", e.reason);
			window.parent.postMessage({ action: 'toast', msg: 'PROMISE ERROR: ' + (e.reason ? e.reason.message || e.reason : 'Unknown'), persistent: true }, "*");
		});

		// --- MISSING COORDINATE REPORTER LOGIC ---
		window.currentMapId = null;
		window.currentMapName = "";

		function getExpac(mapId, mapName) {
			const id = parseInt(mapId);
			if ([1043, 1045, 1052, 1068, 1155, 1165, 1175, 1178, 1185, 1195, 1203, 1206].includes(id)) return "hot";
			if ([1210, 1211, 1224, 1225, 1226, 1228, 1248, 1250, 1263, 1271, 1317].includes(id)) return "pof";
			if ([1330, 1343, 1370, 1384].includes(id)) return "ibs";
			if ([1422, 1428, 1438, 1442, 1452, 1462].includes(id)) return "eod";
			if ([1484, 1485, 1494].includes(id)) return "soto";
			if ([1519, 1520].includes(id)) return "jw";

			const name = (mapName || "").toLowerCase();
			if (name.includes("verdant brink") || name.includes("auric basin") || name.includes("tangled depths") || name.includes("dragon's stand") || name.includes("bitterfrost") || name.includes("ember bay") || name.includes("lake doric") || name.includes("draconis") || name.includes("siren's")) return "hot";
			if (name.includes("oasis") || name.includes("highlands") || name.includes("riverlands") || name.includes("desolation") || name.includes("vabbi") || name.includes("istan") || name.includes("sandswept") || name.includes("kourna") || name.includes("jahai") || name.includes("thunderhead") || name.includes("dragonfall")) return "pof";
			if (name.includes("grothmar") || name.includes("bjora") || name.includes("drizzlewood")) return "ibs";
			if (name.includes("seitung") || name.includes("kaineng") || name.includes("echovald") || name.includes("dragon's end") || name.includes("gyala")) return "eod";
			if (name.includes("skywatch") || name.includes("amnytas") || name.includes("nayos")) return "soto";
			if (name.includes("lowland") || name.includes("syntri")) return "jw";

			return "core";
		}

		function getCategory(nodeName) {
			const name = (nodeName || "").toLowerCase();
			if (name.includes("chest") || name.includes("coffer") || name.includes("casket") || name.includes("cache")) return "chests";
			if (name.includes("ore") || name.includes("vein") || name.includes("copper") || name.includes("iron") || name.includes("silver") || name.includes("gold") || name.includes("platinum") || name.includes("mithril") || name.includes("orichalcum")) return "ore";
			if (name.includes("sapling") || name.includes("wood") || name.includes("log")) return "wood";
			if (name.includes("plant") || name.includes("vegetable") || name.includes("herb") || name.includes("flax") || name.includes("farm") || name.includes("lettuce") || name.includes("cabbage") || name.includes("berry") || name.includes("grape") || name.includes("melon")) return "plants";
			if (name.includes("pet") || name.includes("juvenile")) return "ranger_pets";
			return "map_specific";
		}

		function getIcon(nodeName, category) {
			const name = (nodeName || "").toLowerCase();
			if (category === "chests") return "https://wiki.guildwars2.com/images/c/c6/Feat_chest_%28map_icon%29.png";
			if (category === "ore") {
				if (name.includes("rich")) return "https://wiki.guildwars2.com/images/b/b3/Rich_ore_node_icon.png";
				return "https://render.guildwars2.com/file/C7E13105A754F639BB6C7A439F06CF45C9EB1C18/2595189.png";
			}
			if (category === "wood") return "https://wiki.guildwars2.com/images/0/03/Wood_Log.png";
			if (category === "ranger_pets") return "https://gw2ps.local/Assets/RangerPetIcons/ranger_icon.png";
			return "https://wiki.guildwars2.com/images/c/c6/Feat_chest_%28map_icon%29.png";
		}

		window.openReportModal = function() {
			const modal = document.getElementById('report-modal');
			modal.classList.add('active');
			
			// Clear node name input for a clean slate
			document.getElementById('rep-node-name').value = '';
		};

		window.closeReportModal = function() {
			const modal = document.getElementById('report-modal');
			modal.classList.remove('active');
		};

		window.submitCoordinateReport = function() {
			const nodeName = document.getElementById('rep-node-name').value.trim();

			if (!nodeName) {
				window.parent.postMessage({ action: 'toast', msg: 'ERROR: NODE NAME REQUIRED.' }, "*");
				return;
			}

			// Ensure live telemetry player position is active
			if (!playerPos) {
				window.parent.postMessage({ action: 'toast', msg: 'ERROR: NO TELEMETRY AVAILABLE. STAND ON THE NODE IN-GAME FIRST.' }, "*");
				return;
			}

			const submitBtn = document.getElementById('rep-submit-btn');
			const cancelBtn = document.getElementById('rep-cancel-btn');
			submitBtn.disabled = true;
			cancelBtn.disabled = true;
			submitBtn.innerText = 'SENDING...';

			// Hardcoded active Web App URL to prevent old cached URLs in localStorage from overriding it
			const scriptUrl = "https://script.google.com/macros/s/AKfycbxmydcD3Pesd6oJUm_BC4GRL7g9wMmEJUctpAftOo3v-cJnogUjG99Vl7MYVE-utoop/exec";

			// Automatic extraction from telemetry data
			const x = Math.round(playerPos[1] * 10) / 10;
			const y = Math.round(playerPos[0] * 10) / 10;
			const z = playerAltitude !== null ? Math.round(playerAltitude) : 0;
			const mapName = window.currentMapName || "";
			const expac = getExpac(window.currentMapId, mapName);

			// Construct the simple, clean JSON format exactly as requested by the user
			const dbEntry = {
				pos: [x, y],
				node: nodeName,
				yields: [""],
				icon: "",
				alt: z,
				map_id: parseInt(window.currentMapId) || 0,
				map_name: mapName,
				expac: expac,
				category: "",
				layer: "",
				desc: ""
			};

			// Build final Discord payload wrapping the entry in a copyable JSON markdown code block
			const discordPayload = {
				username: "Tyrian Lens Scout",
				avatar_url: "https://raw.githubusercontent.com/Yoast79/Tyrian-Lens/main/Assets/app_icon.ico",
				content: "```json\n" + JSON.stringify(dbEntry, null, 4) + "\n```"
			};

			fetch(scriptUrl, {
				method: 'POST',
				mode: 'no-cors',
				headers: {
					'Content-Type': 'text/plain;charset=utf-8'
				},
				body: JSON.stringify(discordPayload)
			}).then(() => {
				window.parent.postMessage({ action: 'toast', msg: 'REPORT SENT SUCCESSFULLY! THANK YOU FOR CONTRIBUTING!' }, "*");
				closeReportModal();
			}).catch(err => {
				console.error("Report transmission failed:", err);
				window.parent.postMessage({ action: 'toast', msg: 'ERROR: REPORT TRANSMISSION FAILED. CHECK INTERNET.' }, "*");
			}).finally(() => {
				submitBtn.disabled = false;
				cancelBtn.disabled = false;
				submitBtn.innerText = 'SUBMIT REPORT';
			});
		};

		document.body.setAttribute('data-theme', localStorage.getItem('gw2_theme') || 'human');
		/*]]>*/
	</script>
