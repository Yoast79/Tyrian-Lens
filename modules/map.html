<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="https://gw2ps.local/Assets/core.css" />
	<link rel="stylesheet" href="https://gw2ps.local/Assets/Leaflet/leaflet.css" />
	<link rel="stylesheet" href="https://gw2ps.local/Assets/Leaflet/MarkerCluster.css" />
	<link rel="stylesheet" href="https://gw2ps.local/Assets/Leaflet/MarkerCluster.Default.css" />
	<script src="https://gw2ps.local/Assets/Leaflet/leaflet.js"></script>
	<script src="https://gw2ps.local/Assets/Leaflet/leaflet.markercluster.js"></script>
	<style>
		* {
			cursor: url("https://gw2ps.local/Assets/Icons/mouse_cursor.png"), auto !important;
		}

		.leaflet-interactive {
			pointer-events: auto !important;
			cursor: url("https://gw2ps.local/Assets/Icons/mouse_cursor.png"), auto !important;
		}

		body,
		html,
		#map {
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			background: #000;
			overflow: hidden;
		}

		.player-icon-container {
			background: none !important;
			border: none !important;
		}

		.altitude-div-icon {
			background: none !important;
			border: none !important;
			overflow: visible !important;
		}

		.altitude-indicator {
			pointer-events: none !important;
		}

		.map-label {
			font-family: serif;
			color: #e2c07d;
			font-weight: bold;
			text-transform: uppercase;
			white-space: nowrap;
			background: none !important;
			border: none !important;
			pointer-events: auto !important;
			text-align: center;
			-webkit-text-stroke: 2px black;
			paint-order: stroke fill;
			text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.7);
		}

		.region-label {
			font-size: 18px;
			letter-spacing: 5px;
		}

		.map-title-label {
			font-size: 14px;
			letter-spacing: 2px;
		}

		.map-meta-row {
			display: flex;
			align-items: center;
			gap: 6px;
			font-size: 11px;
			text-transform: none;
			color: #fff;
			white-space: nowrap;
		}

		.map-meta-item {
			display: flex;
			align-items: center;
			gap: 3px;
		}

		.map-meta-icon {
			width: 12px;
			height: 12px;
			filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.5));
		}

		.map-meta-divider {
			color: #8a7a5f;
			opacity: 0.8;
			font-size: 14px;
			line-height: 1;
		}

		.sector-label {
			font-size: 12px;
			letter-spacing: 1px;
			text-transform: none;
		}

		.compass-container {
			position: fixed;
			bottom: 30px;
			right: 30px;
			z-index: 9000;
			width: 130px;
			height: 130px;
			background: url("https://gw2ps.local/Assets/Icons/Map_navigation_compass.png") center/contain no-repeat;
			pointer-events: none;
		}

		#compass-glow {
			position: absolute;
			top: 48px;
			left: 48px;
			width: 34px;
			height: 34px;
			border-radius: 50%;
			background: rgba(0, 150, 255, 0.4);
			box-shadow: 0 0 15px 8px rgba(0, 130, 255, 0.8);
			opacity: 0;
			transition: opacity 0.3s ease;
			pointer-events: none;
		}

		.tracking-active #compass-glow {
			opacity: 1;
			animation: pulseGlow 1.2s infinite ease-in-out;
		}

		@keyframes pulseGlow {
			0% {
				transform: scale(0.9);
				opacity: 0.5;
			}

			50% {
				transform: scale(1.05);
				opacity: 0.9;
			}

			100% {
				transform: scale(0.9);
				opacity: 0.5;
			}
		}

		.nav-hitbox {
			position: absolute;
			width: 34px;
			height: 34px;
			background: rgba(0, 0, 0, 0);
			z-index: 9001;
			pointer-events: auto;
		}

		#coord-hud {
			position: fixed;
			bottom: 20px;
			left: 20px;
			z-index: 10000;
			background: rgba(10, 8, 5, 0.85);
			border: 1px solid #4a3b2a;
			padding: 10px 15px;
			color: #e2c07d;
			font-family: monospace;
			font-size: 12px;
			pointer-events: none;
			line-height: 1.6;
		}

		.coord-val {
			color: #ffffff;
			font-weight: bold;
		}

		/* Marker Glow Animation */
		@keyframes markerPulse {
			0% {
				filter: drop-shadow(0 0 2px rgba(226, 192, 125, 0.4));
			}

			50% {
				filter: drop-shadow(0 0 10px rgba(226, 192, 125, 1));
			}

			100% {
				filter: drop-shadow(0 0 2px rgba(226, 192, 125, 0.4));
			}
		}

		.marker-glow {
			animation: markerPulse 2s infinite ease-in-out;
		}

		/* Premium Ranger Pet Marker Styling */
		.pet-marker {
			background: rgba(10, 30, 15, 0.85) !important;
			border: 2px solid #2ecc71 !important;
			border-radius: 50% !important;
			box-shadow: 0 0 10px rgba(46, 204, 113, 0.6), inset 0 0 5px rgba(46, 204, 113, 0.3) !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
			overflow: hidden !important;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
			box-sizing: border-box !important;
		}

		.pet-marker:hover {
			border-color: #55efc4 !important;
			box-shadow: 0 0 25px 8px rgba(46, 204, 113, 0.95), inset 0 0 10px rgba(46, 204, 113, 0.7) !important;
			z-index: 10000 !important;
		}

		.pet-marker img {
			width: 150% !important;
			height: 150% !important;
			border-radius: 50% !important;
			object-fit: cover !important;
		}

		/* Optional Breathing Pulse keyframes and class */
		@keyframes petPulse {
			0% {
				box-shadow: 0 0 8px rgba(46, 204, 113, 0.6), inset 0 0 5px rgba(46, 204, 113, 0.3) !important;
				border-color: #2ecc71 !important;
			}
			50% {
				box-shadow: 0 0 25px 8px rgba(46, 204, 113, 1), inset 0 0 8px rgba(46, 204, 113, 0.8) !important;
				border-color: #55efc4 !important;
			}
			100% {
				box-shadow: 0 0 8px rgba(46, 204, 113, 0.6), inset 0 0 5px rgba(46, 204, 113, 0.3) !important;
				border-color: #2ecc71 !important;
			}
		}


		/* Transform-Safe Premium Blue Circle Highlight Beacon for Search Results */
		@keyframes highlightActivePulse {
			0% {
				box-shadow: 0 0 10px rgba(0, 168, 255, 0.6), inset 0 0 5px rgba(0, 168, 255, 0.4) !important;
				border-color: #00a8ff !important;
			}
			50% {
				box-shadow: 0 0 30px 12px rgba(0, 168, 255, 1), inset 0 0 12px rgba(0, 168, 255, 0.8) !important;
				border-color: #ffffff !important;
			}
			100% {
				box-shadow: 0 0 10px rgba(0, 168, 255, 0.6), inset 0 0 5px rgba(0, 168, 255, 0.4) !important;
				border-color: #00a8ff !important;
			}
		}

		.highlight-active {
			border-radius: 50% !important;
			border: 2px solid #00a8ff !important;
			background: rgba(0, 168, 255, 0.25) !important;
			z-index: 10001 !important;
			animation: highlightActivePulse 1.2s infinite ease-in-out !important;
			box-sizing: border-box !important;
			pointer-events: none !important;
		}

		/* Transform-Safe Premium Fuchsia/Magenta Circle Highlight Beacon for Resource Nodes */
		@keyframes highlightNodePulse {
			0% {
				box-shadow: 0 0 10px rgba(255, 0, 180, 0.6), inset 0 0 5px rgba(255, 0, 180, 0.4) !important;
				border-color: #ff00b4 !important;
			}
			50% {
				box-shadow: 0 0 30px 12px rgba(255, 0, 180, 1), inset 0 0 12px rgba(255, 0, 180, 0.8) !important;
				border-color: #ffffff !important;
			}
			100% {
				box-shadow: 0 0 10px rgba(255, 0, 180, 0.6), inset 0 0 5px rgba(255, 0, 180, 0.4) !important;
				border-color: #ff00b4 !important;
			}
		}

		.highlight-node-active {
			border-radius: 50% !important;
			border: 2px solid #ff00b4 !important;
			background: rgba(255, 0, 180, 0.25) !important;
			z-index: 10001 !important;
			animation: highlightNodePulse 1.2s infinite ease-in-out !important;
			box-sizing: border-box !important;
			pointer-events: none !important;
		}

		/* Transform-Safe Gold Highlight Beacon for Pact Supply Agents & Elisa */
		@keyframes highlightGoldPulse {
			0% {
				box-shadow: 0 0 10px rgba(255, 215, 0, 0.6), inset 0 0 5px rgba(255, 215, 0, 0.4) !important;
				border-color: #ffd700 !important;
			}
			50% {
				box-shadow: 0 0 30px 12px rgba(255, 215, 0, 1), inset 0 0 12px rgba(255, 215, 0, 0.8) !important;
				border-color: #ffffff !important;
			}
			100% {
				box-shadow: 0 0 10px rgba(255, 215, 0, 0.6), inset 0 0 5px rgba(255, 215, 0, 0.4) !important;
				border-color: #ffd700 !important;
			}
		}

		.psna-highlight-active {
			border-radius: 50% !important;
			border: 2px solid #ffd700 !important;
			background: rgba(255, 215, 0, 0.25) !important;
			z-index: 10001 !important;
			animation: highlightGoldPulse 1.2s infinite ease-in-out !important;
			box-sizing: border-box !important;
		}

		.highlight-pulse {
			z-index: 1000 !important;
			border-radius: 50%;
			background: rgba(255, 215, 0, 0.4);
			box-shadow: 0 0 15px 5px rgba(255, 215, 0, 0.8);
			animation: highlight-pulse-anim 1s infinite !important;
		}

		@keyframes highlight-pulse-anim {
			0% {
				transform: scale(1);
				filter: drop-shadow(0 0 5px #e2c07d);
				opacity: 0.8;
			}

			50% {
				transform: scale(1.3);
				filter: drop-shadow(0 0 15px #fff);
				opacity: 1;
			}

			100% {
				transform: scale(1);
				filter: drop-shadow(0 0 5px #e2c07d);
				opacity: 0.8;
			}
		}

		.pet-marker.highlight-active {
			z-index: 9999 !important;
		}

		.pet-marker.highlight-active::after {
			content: '';
			position: absolute;
			top: 50%;
			left: 50%;
			width: 60px;
			height: 60px;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			border: 3px solid #e2c07d;
			box-shadow: 0 0 15px #e2c07d, inset 0 0 10px #e2c07d;
			animation: petPulse 2s infinite ease-in-out;
			pointer-events: none;
		}

		@keyframes petPulse {
			0% {
				transform: translate(-50%, -50%) scale(0.8);
				opacity: 0.3;
			}

			50% {
				transform: translate(-50%, -50%) scale(1.2);
				opacity: 0.8;
			}

			100% {
				transform: translate(-50%, -50%) scale(0.8);
				opacity: 0.3;
			}
		}

		.boss-active {
			border-radius: 50%;
			box-shadow: 0 0 0 0 rgba(0, 255, 0, 1);
			animation: pulse-green 2s infinite;
			background-color: rgba(0, 255, 0, 0.3);
		}

		@keyframes pulse-green {
			0% {
				box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7);
			}

			70% {
				box-shadow: 0 0 0 10px rgba(0, 255, 0, 0);
			}

			100% {
				box-shadow: 0 0 0 0 rgba(0, 255, 0, 0);
			}
		}

		/* Personal Marker UI Styles */
		#marker-picker {
			display: none;
			position: absolute;
			z-index: 20000;
			background: rgba(10, 8, 5, 0.95);
			border: 1px solid #4a3b2a;
			padding: 5px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
		}

		.marker-row {
			display: flex;
		}

		.marker-icon-btn {
			width: 24px;
			height: 24px;
			cursor: pointer;
			margin: 2px;
			border: 1px solid transparent;
			transition: 0.2s;
		}

		.marker-icon-btn:hover {
			border-color: #e2c07d;
			background: rgba(226, 192, 125, 0.2);
		}

		.prompt-overlay {
			display: none;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: rgba(10, 8, 5, 0.98);
			border: 1px solid #e2c07d;
			padding: 20px;
			z-index: 20001;
			text-align: center;
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
			font-family: "Crimson Text", serif;
		}

		.prompt-btn {
			background: #1a1510;
			border: 1px solid #4a3b2a;
			color: #e2c07d;
			padding: 5px 15px;
			cursor: pointer;
			font-family: "Crimson Text", serif;
			font-weight: bold;
			margin: 0 5px;
			text-transform: uppercase;
			transition: 0.2s;
		}

		.prompt-btn:hover {
			background: #2a221a;
			border-color: #e2c07d;
		}

		.prompt-btn.danger {
			color: #ff4a4a;
		}

		/* Glassmorphic Node Reporting Modal */
		.report-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.75);
			backdrop-filter: blur(5px);
			z-index: 25000;
			align-items: center;
			justify-content: center;
			opacity: 0;
			transition: opacity 0.3s ease;
			pointer-events: auto !important;
		}

		.report-overlay.active {
			display: flex;
			opacity: 1;
		}

		.report-card {
			background: rgba(15, 12, 8, 0.95);
			border: 1px solid #e2c07d;
			box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(226, 192, 125, 0.2);
			width: 440px;
			padding: 25px;
			font-family: "Crimson Text", serif;
			letter-spacing: 1px;
			transform: scale(0.9);
			transition: transform 0.3s ease;
		}

		.report-tutorial {
			color: #8a7a5f;
			font-size: 13px;
			line-height: 1.5;
			margin-bottom: 20px;
			text-align: justify;
			text-transform: none;
		}

		.report-overlay.active .report-card {
			transform: scale(1);
		}

		.report-title {
			color: #e2c07d;
			font-size: 18px;
			font-weight: bold;
			text-transform: uppercase;
			border-bottom: 1px solid #4a3b2a;
			padding-bottom: 8px;
			margin-bottom: 20px;
			text-align: center;
		}

		.report-group {
			margin-bottom: 15px;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.report-label {
			color: #8a7a5f;
			font-size: 12px;
			text-transform: uppercase;
			font-weight: bold;
		}

		.report-input {
			background: rgba(26, 21, 16, 0.8);
			border: 1px solid #4a3b2a;
			color: #ffffff;
			padding: 8px 10px;
			font-size: 13px;
			font-family: inherit;
			outline: none;
			transition: border-color 0.2s;
		}

		.report-input:focus {
			border-color: #e2c07d;
		}

		.report-row {
			display: flex;
			gap: 10px;
		}

		.report-row .report-group {
			flex: 1;
		}

		.report-btn-row {
			display: flex;
			gap: 10px;
			margin-top: 20px;
		}

		.report-btn {
			flex: 1;
			background: #1a1510;
			border: 1px solid #4a3b2a;
			color: #e2c07d;
			padding: 10px;
			font-size: 13px;
			font-weight: bold;
			cursor: pointer;
			text-transform: uppercase;
			font-family: inherit;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}

		.report-btn:hover:not(:disabled) {
			background: #2a221a;
			border-color: #e2c07d;
			color: #ffffff;
		}

		.report-btn:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.report-btn.secondary {
			background: transparent;
			color: #8a7a5f;
		}

		.report-btn.secondary:hover {
			border-color: #8a7a5f;
			color: #ffffff;
		}

		.report-btn.grab {
			background: rgba(226, 192, 125, 0.15);
			border-color: #e2c07d;
			font-size: 12px;
			padding: 8px;
			margin-bottom: 15px;
			width: 100%;
		}

		.report-btn.grab:hover {
			background: rgba(226, 192, 125, 0.3);
		}
	</style>
</head>

<body class="tracking-active">
	<div id="map"></div>
	<div id="marker-picker"></div>
	<div id="marker-label-prompt" class="prompt-overlay">
		<div
			style="color: #e2c07d; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;">
			Label Marker</div>
		<input type="text" id="marker-label-input"
			style="background: #1a1510; border: 1px solid #4a3b2a; color: #fff; padding: 5px; width: 200px; margin-bottom: 15px; font-family: 'Crimson Text', serif;" />
		<br>
		<button class="prompt-btn" onclick="saveMarkerLabel()">Save</button>
		<button class="prompt-btn" onclick="cancelMarkerLabel()">Cancel</button>
	</div>
	<div id="marker-remove-prompt" class="prompt-overlay">
		<div
			style="color: #e2c07d; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;">
			Remove Marker?</div>
		<button class="prompt-btn danger" onclick="confirmRemoveMarker()">Remove</button>
		<button class="prompt-btn" onclick="cancelRemoveMarker()">Cancel</button>
	</div>

	<!-- Missing Coordinate Reporter Modal -->
	<div id="report-modal" class="report-overlay">
		<div class="report-card">
			<div class="report-title">Report Node Coordinate</div>
			
			<div class="report-tutorial">
				Please stand directly on top of the target node in-game, enter its name below, and click Submit. Telemetry and coordinates are captured automatically.
			</div>

			<div class="report-group" style="margin-bottom: 20px;">
				<span class="report-label">Node Name / Description</span>
				<input type="text" id="rep-node-name" class="report-input" placeholder="e.g. Rich Platinum Ore, Elisa, etc." autocomplete="off" />
			</div>

			<div class="report-btn-row">
				<button id="rep-cancel-btn" class="report-btn secondary" onclick="closeReportModal()">Cancel</button>
				<button id="rep-submit-btn" class="report-btn" onclick="submitCoordinateReport()">Submit Report</button>
			</div>
		</div>
	</div>

	<div id="coord-hud" style="pointer-events: auto !important;">
		<div>
			PLAYER: <span id="p-x" class="coord-val">0</span>, <span id="p-y" class="coord-val">0</span>
		</div>
		<div>
			CURSOR: <span id="c-x" class="coord-val">0</span>, <span id="c-y" class="coord-val">0</span>
		</div>
		<div style="font-size: 10px; color: #888; margin-top: 6px; text-transform: uppercase; display: flex; gap: 24px;">
			<span>ALTITUDE: <span id="p-z" class="coord-val">0</span></span>
			<span>TRACKING: <span id="track-status" style="color:#00ff00;">ON</span></span>
		</div>
		<div style="margin-top: 8px; border-top: 1px solid #4a3b2a; padding-top: 8px;">
			<button class="prompt-btn" style="width: 100%; margin: 0; padding: 4px;" onclick="openReportModal()">Report Node</button>
		</div>
	</div>

	<div class="compass-container">
		<div id="compass-glow"></div>
		<div class="nav-hitbox" style="top:48px; left:48px;" onclick="setTracking(true)"
			onmouseover="window.parent.postMessage({action:'showTooltip', text:'Track Player', x:event.clientX, y:event.clientY, offsetTop: 45}, '*')"
			onmouseout="window.parent.postMessage({action:'hideTooltip'}, '*')"></div>
		<div class="nav-hitbox" style="top:0px; left:48px;" onclick="jump('Central Tyria')"
			onmouseover="window.parent.postMessage({action:'showTooltip', text:'Central Tyria', x:event.clientX, y:event.clientY, offsetTop: 45}, '*')"
			onmouseout="window.parent.postMessage({action:'hideTooltip'}, '*')"></div>
		<div class="nav-hitbox" style="top:48px; right:0px;" onclick="jump('Crystal Desert')"
			onmouseover="window.parent.postMessage({action:'showTooltip', text:'Crystal Desert', x:event.clientX, y:event.clientY, offsetTop: 45}, '*')"
			onmouseout="window.parent.postMessage({action:'hideTooltip'}, '*')"></div>
		<div class="nav-hitbox" style="bottom:0px; left:48px;" onclick="jump('Cantha')"
			onmouseover="window.parent.postMessage({action:'showTooltip', text:'Cantha', x:event.clientX, y:event.clientY, offsetTop: 45}, '*')"
			onmouseout="window.parent.postMessage({action:'hideTooltip'}, '*')"></div>
		<div class="nav-hitbox" style="top:48px; left:0px;" onclick="jump('Heart of Maguuma')"
			onmouseover="window.parent.postMessage({action:'showTooltip', text:'Heart of Maguuma', x:event.clientX, y:event.clientY, offsetTop: 45}, '*')"
			onmouseout="window.parent.postMessage({action:'hideTooltip'}, '*')"></div>
		<div class="nav-hitbox" style="bottom:10px; left:10px;" onclick="jump('Castora')"

	</div>

	<script>
		/*<![CDATA[*/
		const BORDER_CONFIG = {
			floors: [1, 2, 49],
			styles: {
				color: '#8a7a5f',
				weight: 2,
				fillOpacity: 0
			},
			globalOffset: { x: 0, y: 0 }

		var isTracking = true;
		var currentMenuOffset = 0;
		var layerToggles = { 'poi': true, 'waypoint': true, 'vista': true, 'heart': true, 'heropoint': true, 'mastery': true, 'region': true, 'map_text': true, 'sector': true, 'personal_markers': true, 'map_borders': true };
		var map;

		// Altitude Proximity Engine Variables
		var altitudeNodesData = [];
		var altitudeMarkersMap = new Map();
		var activeAltitudeIndicators = new Map();
		const ALTITUDE_LOAD_DISTANCE = 2500;
		const ALTITUDE_THRESHOLD = 8.0;
		const ICON_ABOVE = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2Ij4gIDxjaXJjbGUgY3g9IjgiIGN5PSI4IiByPSI3LjUiIGZpbGw9InJnYmEoMTAsOCw1LDAuOSkiIHN0cm9rZT0iIzJlY2M3MSIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4gIDxwYXRoIGQ9Ik00IDEwbDQtNCA0IDQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzJlY2M3MSIgc3Ryb2tlLXdpZHRoPSIyLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg==";
		const ICON_BELOW = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2Ij4gIDxjaXJjbGUgY3g9IjgiIGN5PSI4IiByPSI3LjUiIGZpbGw9InJnYmEoMTAsOCw1LDAuOSkiIHN0cm9rZT0iI2U3NGMzYyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4gIDxwYXRoIGQ9Ik00IDZsNCA0IDQtNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZTc0YzNjIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PC9zdmc+";
		var playerPos = null;
		var playerAltitude = null;
		var markers = [];
		var subLayers = {};
		var layerToSectionMap = {};
		var activeHighlightMarker = null;
		var activeTempIconMarker = null;
		var activeHighlightTimeout = null;
		var markerDataCache = [];
		var npcDataCache = [];
		var layerMap = { 'region': L.layerGroup(), 'map_text': L.layerGroup(), 'sector': L.layerGroup() };
		var borderLayer = L.layerGroup();

		var map = L.map("map", { crs: L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(1 / 128, 0, 1 / 128, 0) }), minZoom: 1, maxZoom: 9, zoomControl: false, attributionControl: false, doubleClickZoom: false });

		map.createPane('mistlockPane').style.zIndex = 250;
		map.createPane('iconPane').style.zIndex = 650;
		map.createPane('textPane').style.zIndex = 700;
		map.getPane('textPane').style.pointerEvents = 'none';
		map.createPane('playerPane').style.zIndex = 800;
		map.getPane('playerPane').style.pointerEvents = 'none';
		map.createPane('customMarkerPane').style.zIndex = 850;
		map.createPane('highlightPane').style.zIndex = 590;
		map.getPane('highlightPane').style.pointerEvents = 'none';

		var mapStorageKey = 'gw2_custom_markers_tyria';

		const createClusterIcon = (cluster) => {
			var markers = cluster.getAllChildMarkers();
			if (!markers || markers.length === 0) return L.divIcon({ html: '' });
			var count = markers.length;
			
			let baseSize = 24;
			let isPet = false;
			let firstMarker = markers[0];
			let iconUrl = "";
			
			if (firstMarker.options.icon && firstMarker.options.icon.options) {
				let opt = firstMarker.options.icon.options;
				iconUrl = opt.iconUrl || "";
				if (opt.className && opt.className.includes("pet-marker")) {
					isPet = true;
					baseSize = 52; // Perfect 52px base size for pet clusters
				}
			}
			
			if (isPet) {
				iconUrl = "https://gw2ps.local/Assets/RangerPetIcons/ranger_icon.png";
			} else {
				if (firstMarker.options.data) {
					const d = firstMarker.options.data;
					if (d.category === 'mastery_insights' || d.layer === 'node_mastery_insight') {
						let exp = (d.expac || "").toLowerCase();
						iconUrl = "https://gw2ps.local/Assets/Icons/mi_tyria.png";
						if (exp === "hot") iconUrl = "https://gw2ps.local/Assets/Icons/mi_hot.png";
						else if (exp === "pof") iconUrl = "https://gw2ps.local/Assets/Icons/mi_pof.png";
						else if (exp === "ibs") iconUrl = "https://gw2ps.local/Assets/Icons/mi_ibs.png";
						else if (exp === "voe") iconUrl = "https://gw2ps.local/Assets/Icons/mi_voe.png";
						else if (exp === "eod") iconUrl = "https://gw2ps.local/Assets/Icons/mi_eod.png";
						else if (exp === "jw") iconUrl = "https://gw2ps.local/Assets/Icons/mi_jw.png";
						else if (exp === "soto") iconUrl = "https://gw2ps.local/Assets/Icons/mi_soto.png";
					} else if (d.icon) {
						iconUrl = d.icon;
					}
				}
				
				if (!iconUrl && firstMarker.options.icon && firstMarker.options.icon.options) {
					iconUrl = firstMarker.options.icon.options.iconUrl || "";
				}
				
				if (!iconUrl) {
					iconUrl = "https://gw2ps.local/Assets/Icons/poi_discovered.png";
				}
			}
			
			let scale = isPet ? farmScale : locScale;
			let size = Math.round(baseSize * scale);
			
			let html = "";
			if (isPet) {
				html = `<div style="position: relative; display: flex; align-items: center; justify-content: center; width: ${size}px; height: ${size}px;">
							<img src="${iconUrl}" style="width: ${size}px; height: ${size}px;" />
							<div style="position: absolute; bottom: -3px; right: -3px; background: rgba(10,30,15,0.95); color: #2ecc71; border: 1px solid #2ecc71; border-radius: 4px; font-size: 9px; padding: 0px 3px; font-weight: bold; font-family: sans-serif; box-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 10;">${count}</div>
						</div>`;
			} else {
				html = `<div style="position: relative; display: flex; align-items: center; justify-content: center; width: ${size}px; height: ${size}px;">
							<img src="${iconUrl}" style="width: ${size}px; height: ${size}px;" />
							<div style="position: absolute; bottom: -3px; right: -3px; background: rgba(10,8,5,0.9); color: #e2c07d; border: 1px solid #e2c07d; border-radius: 4px; font-size: 9px; padding: 0px 3px; font-weight: bold; font-family: monospace; box-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 10;">${count}</div>
						</div>`;
			}
			
			return L.divIcon({ 
				html: html, 
				className: isPet ? 'pet-cluster-icon' : 'custom-cluster-icon', 
				iconSize: [size, size], 
				iconAnchor: [size / 2, size / 2] 
			});
		};

		var customMarkersLayer = L.markerClusterGroup({ disableClusteringAtZoom: 7, maxClusterRadius: 40, showCoverageOnHover: false, iconCreateFunction: createClusterIcon }).addTo(map);

		var mSettings = JSON.parse(localStorage.getItem('gw2_settings') || '{}');

		// Setup separate scale factors
		var locScale = mSettings.markerScale !== undefined ? (mSettings.markerScale / 100) : 1.0;
		var farmScale = mSettings.farmingMarkerScale !== undefined ? (mSettings.farmingMarkerScale / 100) : 1.0;

		const farmingScaleNodes = [
			'node_pact_supply_network_agent',
			'node_mist_rift',
			'node_ranger_pet',
			'node_world_boss',
			'node_fishing_hole'
		];

		function isIndependentNode(name) {
			const section = layerToSectionMap[name];
			if (section && section !== 'farming_nodes') return true;
			
			// Hardcoded fallbacks for built-in custom action layers
			const defaultIndependent = [
				'node_zone_portal', 'node_mist_rift', 'node_pact_supply_network_agent', 
				'node_ranger_pet', 'node_fishing_hole', 'node_historian_elisa'
			];
			if (defaultIndependent.includes(name)) return true;
			
			return false;
		}

		// NPC service yields → sublayer key mapping
		function getNpcLayerKey(service) {
			const s = (service || '').toLowerCase();
			if (s.includes('weaponsmith')) return 'node_npc_weaponsmith';
			if (s.includes('armorsmith')) return 'node_npc_armorsmith';
			if (s.includes('tailor')) return 'node_npc_tailor';
			if (s.includes('chef') || s.includes('cooking')) return 'node_npc_chef';
			if (s.includes('leatherworker')) return 'node_npc_leatherworker';
			if (s.includes('huntsman')) return 'node_npc_huntsman';
			if (s.includes('jeweler')) return 'node_npc_jeweler';
			if (s.includes('artificer')) return 'node_npc_artificer';
			if (s.includes('gathering merchant')) return 'node_npc_gathering_merchant';
			if (s.includes('dungeon merchant')) return 'node_npc_dungeon_merchant';
			if (s.includes('laurel merchant')) return 'node_npc_laurel_merchant';
			if (s.includes('guild vault') || s.includes('guild bank')) return 'node_npc_guild_vault';
			if (s.includes('account vault') || s === 'bank') return 'node_npc_bank';
			if (s.includes('trading post')) return 'node_npc_trading_post';
			if (s.includes('reinforce armor')) return 'node_npc_reinforce_armor';
			if (s.includes('guild commendation')) return 'node_npc_guild_commendation';
			if (s.includes('merchant') || s.includes('karma') || s.includes('vendor') ||
				s.includes('bartender') || s.includes('fishmonger') || s.includes('fishing supplies') ||
				s.includes('research merchant')) return 'node_npc_merchant';
			return 'node_npc_misc';
		}

		L.tileLayer("https://tiles.guildwars2.com/1/1/{z}/{x}/{y}.jpg", { noWrap: true, maxNativeZoom: 7, maxZoom: 9 }).addTo(map);
		map.setView([31384, 49071], 4);

		borderLayer.addTo(map);

		var pMarker = L.marker([0, 0], { interactive: false, pane: 'playerPane', icon: L.divIcon({ className: 'player-icon-container', html: '<img id="pImg" src="https://gw2ps.local/Assets/Icons/player_icon.png" style="width:32px;height:32px;" />', iconSize: [32, 32], iconAnchor: [16, 16] }) }).addTo(map);

		function getToggleKey(layerName) {
			return layerName;
		}

		function getMasterCategoryForLayer(key) {
			return layerToSectionMap[key] || 'farming_nodes';
		}

		function isLayerEnabled(layerName) {
			const toggleKey = getToggleKey(layerName);
			const defaultOnKeys = ['poi', 'waypoint', 'vista', 'heart', 'heropoint', 'mastery', 'personal_markers', 'node_zone_portal', 'region', 'map_text', 'sector', 'map_borders'];
			
			let isVisible = layerToggles[toggleKey];
			if (isVisible === undefined) {
				isVisible = defaultOnKeys.includes(toggleKey);
			}
			
			const masterCat = getMasterCategoryForLayer(toggleKey);
			let masterToggles = JSON.parse(localStorage.getItem('gw2_master_toggles') || '{"map-options":true,"farming_nodes":true,"miscellaneous":true}');
			const isMasterOn = masterToggles[masterCat] !== false;
			
			return isMasterOn && isVisible;
		}

		function resolveIconUrl(path) {
			if (!path) return "https://gw2ps.local/Assets/Icons/poi_discovered.png";
			if (path.startsWith("data:")) return path;
			if (path.startsWith("http://") || path.startsWith("https://")) return path;
			
			// Resolve relative path
			if (path.startsWith("Assets/")) return "https://gw2ps.local/" + path;
			if (path.startsWith("/Assets/")) return "https://gw2ps.local" + path;
			if (path.startsWith("../Assets/")) return "https://gw2ps.local/" + path.substring(3);
			
			// Fallback: if it's just a filename
			if (!path.includes("/")) return "https://gw2ps.local/Assets/Icons/" + path;
			
			return path;
		}

		function updateMarkerIconWithIndicator(marker, p, indicatorUrl) {
			let currentScale = farmingScaleNodes.includes(p.layer) ? farmScale : locScale;
			let baseSize = (p.layer === 'node_ranger_pet') ? 45 : (p.layer === 'node_fishing_hole') ? 32 : 24;
			let size = Math.round(baseSize * currentScale);
			let anchor = size / 2;
			let iconUrl = resolveIconUrl(p.icon);

			let markerHtml = `<div class="altitude-marker-container" style="position: relative; width: ${size}px; height: ${size}px; overflow: visible !important;"><img src="${iconUrl}" style="width: ${size}px !important; height: ${size}px !important; max-width: none !important; max-height: none !important; display: block !important;" />`;
			if (indicatorUrl) {
				markerHtml += `<img src="${indicatorUrl}" class="altitude-indicator" style="position: absolute !important; bottom: -4px !important; right: -4px !important; width: 14px !important; height: 14px !important; max-width: none !important; max-height: none !important; z-index: 1000 !important; display: block !important;" />`;
			}
			markerHtml += `</div>`;

			const customIcon = L.divIcon({
				html: markerHtml,
				className: 'altitude-div-icon layer-target-' + p.layer,
				iconSize: [size, size],
				iconAnchor: [anchor, anchor]
			});
			marker.setIcon(customIcon);
		}

		let lastEngineLogTime = 0;
		function updateAltitudeMarkersVisibility() {
			if (!playerPos || altitudeNodesData.length === 0) {
				if (Date.now() - lastEngineLogTime > 5000) {
					console.log(`[Altitude Engine] Waiting for telemetry: playerPos=${playerPos}, nodesCount=${altitudeNodesData.length}`);
					lastEngineLogTime = Date.now();
				}
				return;
			}
			
			if (Date.now() - lastEngineLogTime > 5000) {
				console.log(`[Altitude Engine] Running: playerPos=[${playerPos[1].toFixed(1)}, ${playerPos[0].toFixed(1)}], playerAltitude=${playerAltitude}, nodesCount=${altitudeNodesData.length}, activeIndicatorsCount=${activeAltitudeIndicators.size}`);
				lastEngineLogTime = Date.now();
			}

			if (isDevMode) {
				const hudStatus = document.getElementById("alt-hud-status");
				if (hudStatus) {
					hudStatus.innerText = `ACTIVE (${altitudeNodesData.length} NODES | PLAYER ALT: ${playerAltitude !== null ? playerAltitude.toFixed(1) + 'M' : 'N/A'})`;
					hudStatus.style.color = "#00ff00";
				}
			}

			const py = playerPos[0];
			const px = playerPos[1];
			const nextActiveKeys = new Set();

			altitudeNodesData.forEach(p => {
				if (!p.pos || p.pos.length < 2 || !p.layer) return;
				if (!isLayerEnabled(p.layer)) return;

				const key = p.pos[0] + "_" + p.pos[1] + "_" + p.layer;
				const marker = altitudeMarkersMap.get(key);
				if (!marker) return;

				const dy = py - p.pos[1];
				const dx = px - p.pos[0];
				const distance = Math.sqrt(dx * dx + dy * dy);

				if (distance <= ALTITUDE_LOAD_DISTANCE) {
					let indicatorUrl = null;
					if (playerAltitude !== null && playerAltitude !== undefined && !isNaN(playerAltitude) && p.alt !== undefined && p.alt !== null) {
						const nodeAlt = parseFloat(p.alt);
						if (!isNaN(nodeAlt)) {
							const diff = nodeAlt - playerAltitude;
							if (diff > ALTITUDE_THRESHOLD) {
								indicatorUrl = ICON_ABOVE;
							} else if (diff < -ALTITUDE_THRESHOLD) {
								indicatorUrl = ICON_BELOW;
							}
						}
					}

					if (indicatorUrl) {
						nextActiveKeys.add(key);
						if (activeAltitudeIndicators.get(key) !== indicatorUrl) {
							activeAltitudeIndicators.set(key, indicatorUrl);
							updateMarkerIconWithIndicator(marker, p, indicatorUrl);
						}
					}
				}
			});

			for (const [key, oldIndicator] of activeAltitudeIndicators.entries()) {
				if (!nextActiveKeys.has(key)) {
					const marker = altitudeMarkersMap.get(key);
					if (marker) {
						updateMarkerIconWithIndicator(marker, marker.options.data, null);
					}
					activeAltitudeIndicators.delete(key);
				}
			}
		}

		window.toggleMapLayer = function (name, isVisible) {
			layerToggles[name] = isVisible;
			
			// If we are turning a layer OFF, immediately remove any active temporary clone belonging to that layer!
			if (!isVisible && activeTempIconMarker) {
				if (activeTempIconMarker.options && activeTempIconMarker.options.layerKey === name) {
					map.removeLayer(activeTempIconMarker);
					activeTempIconMarker = null;
				}
			}

			if (name === 'node_historian_elisa') {
				if (isVisible) renderElisaMarker();
				else elisaLayer.clearLayers();
				return;
			}



			if (['region', 'map_text', 'sector', 'map_borders'].includes(name)) {
				refreshLabels();
				return;
			}

			if (name === 'personal_markers') {
				if (isVisible) map.addLayer(customMarkersLayer);
				else map.removeLayer(customMarkersLayer);
				return;
			}

			if (name === 'farming_nodes') {
				Object.keys(subLayers).forEach(key => {
					if (key.startsWith('node_')) {
						if (isIndependentNode(key)) return;
						let individualVisible = layerToggles[key] !== false;
						if (isVisible && individualVisible) map.addLayer(subLayers[key]);
						else map.removeLayer(subLayers[key]);
					}
				});
				return;
			}

			if (subLayers[name]) {
				if (name.startsWith('node_')) {
					if (isIndependentNode(name)) {
						if (isVisible) map.addLayer(subLayers[name]);
						else map.removeLayer(subLayers[name]);
					} else {
						if (isVisible && layerToggles['farming_nodes'] !== false) map.addLayer(subLayers[name]);
						else map.removeLayer(subLayers[name]);
					}
				} else {
					if (isVisible) map.addLayer(subLayers[name]);
					else map.removeLayer(subLayers[name]);
				}
			}
			if (typeof updateAltitudeMarkersVisibility === 'function') {
				updateAltitudeMarkersVisibility();
			}
		};

		// --- PERSONAL MARKER LOGIC ---
		window.pendingMarkerLatLng = null;
		window.pendingMarkerIcon = '';
		window.markerToRemoveId = null;
		window.markerToRemoveLayer = null;

		const customIconsGrid = [
			['marker_achie_blue.png', 'marker_achie_green.png', 'marker_achie_pink.png', 'marker_achie_red.png', 'marker_achie_yellow.png'],
			['marker_castle_blue.png', 'marker_castle_green.png', 'marker_castle_pink.png', 'marker_castle_red.png', 'marker_castle_yellow.png'],
			['marker_chest_blue.png', 'marker_chest_green.png', 'marker_chest_pink.png', 'marker_chest_red.png', 'marker_chest_yellow.png'],
			['marker_shield_blue.png', 'marker_shield_green.png', 'marker_shield_pink.png', 'marker_shield_red.png', 'marker_shield_yellow.png'],
			['marker_star_blue.png', 'marker_star_green.png', 'marker_star_pink.png', 'marker_star_red.png', 'marker_star_yellow.png'],
			['marker_swords_blue.png', 'marker_swords_green.png', 'marker_swords_pink.png', 'marker_swords_red.png', 'marker_swords_yellow.png']
		];

		let pickerHtml = '';
		customIconsGrid.forEach(row => {
			pickerHtml += '<div class="marker-row">';
			row.forEach(icon => {
				pickerHtml += `<img src="https://gw2ps.local/Assets/MarkerIcons/${icon}" class="marker-icon-btn" onclick="selectMarkerIcon('${icon}')" />`;
			});
			pickerHtml += '</div>';
		});
		document.getElementById('marker-picker').innerHTML = pickerHtml;

		map.on('click', function (e) {
			if (e.originalEvent.altKey) {
				window.pendingMarkerLatLng = e.latlng;
				let picker = document.getElementById('marker-picker');
				let px = e.containerPoint.x;
				let py = e.containerPoint.y;
				if (px + 160 > window.innerWidth) px = window.innerWidth - 160;
				if (py + 180 > window.innerHeight) py = window.innerHeight - 180;
				picker.style.left = px + 'px';
				picker.style.top = py + 'px';
				picker.style.display = 'block';
			} else {
				document.getElementById('marker-picker').style.display = 'none';
			}
		});

		window.selectMarkerIcon = function (iconFile) {
			document.getElementById('marker-picker').style.display = 'none';
			window.pendingMarkerIcon = iconFile;
			document.getElementById('marker-label-input').value = "";
			document.getElementById('marker-label-prompt').style.display = 'block';
			document.getElementById('marker-label-input').focus();
		};

		window.saveMarkerLabel = function () {
			let label = document.getElementById('marker-label-input').value;
			document.getElementById('marker-label-prompt').style.display = 'none';
			addCustomMarker(window.pendingMarkerLatLng.lat, window.pendingMarkerLatLng.lng, window.pendingMarkerIcon, label, true);
		};

		window.cancelMarkerLabel = function () {
			document.getElementById('marker-label-prompt').style.display = 'none';
		};

		window.promptRemoveMarker = function (id, layer) {
			window.markerToRemoveId = id;
			window.markerToRemoveLayer = layer;
			document.getElementById('marker-remove-prompt').style.display = 'block';
		};

		window.confirmRemoveMarker = function () {
			if (window.markerToRemoveLayer) {
				customMarkersLayer.removeLayer(window.markerToRemoveLayer);
				let markers = JSON.parse(localStorage.getItem(mapStorageKey) || '[]');
				markers = markers.filter(m => m.id !== window.markerToRemoveId);
				localStorage.setItem(mapStorageKey, JSON.stringify(markers));
			}
			document.getElementById('marker-remove-prompt').style.display = 'none';
			window.parent.postMessage({ action: 'hideTooltip' }, '*');
		};

		window.cancelRemoveMarker = function () {
			document.getElementById('marker-remove-prompt').style.display = 'none';
		};



		function addCustomMarker(lat, lng, iconFile, label, save, existingId) {
			let id = existingId ? existingId : (lat + '_' + lng + '_' + Date.now());

		async function loadFlowingBorders() {
			try {
				let highlightColors = JSON.parse(localStorage.getItem('gw2_highlight_colors') || '{}');
				let activeColor = highlightColors['map_borders'] || '#4a3b2a';
				for (const floorId of BORDER_CONFIG.floors) {
					const response = await fetch(`https://api.guildwars2.com/v2/continents/1/floors/${floorId}`);
					if (!response.ok) continue;

					const data = await response.json();
					const mapsInFloor = data.regions;
					for (const regionId in mapsInFloor) {
						const region = mapsInFloor[regionId];
						for (const mapId in region.maps) {
							const mapData = region.maps[mapId];
							if (mapData.sectors) {
								Object.values(mapData.sectors).forEach(sector => {
									if (sector.bounds && sector.bounds.length > 0) {
										const latlngs = sector.bounds.map(b => {
											let finalX = b[0] + BORDER_CONFIG.globalOffset.x;
											let finalY = b[1] + BORDER_CONFIG.globalOffset.y;
											return [finalY, finalX];
										});
										L.polygon(latlngs, {
											color: activeColor,
											weight: BORDER_CONFIG.styles.weight,
											fillOpacity: BORDER_CONFIG.styles.fillOpacity,
											interactive: false,
											pane: 'iconPane'
										}).addTo(borderLayer);
									}
								});
							}
						}
					}
				}
			} catch (e) { console.error("Failed to load flowing borders:", e); }
		}

			const elapsedWeeks = (currentMs - epoch) / (7 * 24 * 60 * 60 * 1000);
