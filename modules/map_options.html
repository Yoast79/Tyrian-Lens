<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="https://gw2ps.local/Assets/core.css" />
		<style>
			* { cursor: url("https://gw2ps.local/Assets/Icons/mouse_cursor.png"), auto !important; box-sizing: border-box; }
			body {
				margin: 0;
				background: transparent;
				color: var(--text-primary, #e2c07d);
				font-family: "Crimson Text", serif;
				text-transform: uppercase;
				height: 100vh;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}

			/* Styled Scrollbar */
			.menu-content-wrapper::-webkit-scrollbar { width: 6px; }
			.menu-content-wrapper::-webkit-scrollbar-track { background: color-mix(in srgb, var(--bg-panel, #0a0805) 50%, transparent); }
			.menu-content-wrapper::-webkit-scrollbar-thumb { background: var(--border-color, #4a3b2a); border-radius: 3px; }
			.menu-content-wrapper::-webkit-scrollbar-thumb:hover { background: var(--border-highlight, #e2c07d); }

			/* Search Bar Container */
			.search-container {
				background: var(--bg-panel, #0a0805);
				padding: 15px 20px 10px 20px;
				z-index: 10;
				border-bottom: 1px solid var(--border-color, #4a3b2a);
				flex-shrink: 0;
			}

			.menu-content-wrapper {
				flex: 1;
				overflow-y: auto;
				padding: 10px 20px 20px 20px;
				min-height: 0;
			}
			.search-wrapper { position: relative; display: flex; align-items: center; }
			#marker-search {
			width: 100%; background: var(--bg-button, #1a1510); border: 1px solid var(--border-color, #4a3b2a); color: var(--text-primary, #e2c07d);
			padding: 8px 35px 8px 10px; font-family: "Crimson Text", serif; font-size: 14px;
			outline: none; text-transform: uppercase;
			}
			#marker-search:focus { border-color: var(--border-highlight, #e2c07d); }
			.clear-search {
			position: absolute; right: 10px; cursor: pointer; color: var(--text-muted, #8a7a5f);
			font-weight: bold; font-size: 14px; display: none;
			}
			.clear-search:hover { color: var(--danger-color, #ff4a4a); }

			.section-title { font-size: 16px; font-weight: bold; border-bottom: 1px solid var(--border-color, #4a3b2a); margin: 15px 0 10px; padding-bottom: 5px; letter-spacing: 1px; }

			/* Category Styling */
			.category-header { font-size: 14px; font-weight: bold; cursor: pointer; padding: 8px 0; display: flex; align-items: center; border-bottom: 1px solid color-mix(in srgb, var(--border-color, #4a3b2a) 30%, transparent); letter-spacing: 1px; }
			.category-header::before { content: '▶'; font-size: 10px; margin-right: 8px; transition: transform 0.3s; }
			.category-header.open::before { transform: rotate(90deg); }
			.category-items { padding-left: 10px; display: none; margin-top: 5px; }
			.category-items.open { display: block; }

			/* Nested Subcategory Styling */
			.nested-category-header {
				font-size: 11px;
				font-weight: bold;
				cursor: pointer;
				padding: 6px 0 6px 10px;
				display: flex;
				align-items: center;
				border-bottom: 1px solid rgba(74, 59, 42, 0.15);
				letter-spacing: 0.5px;
				color: #cbb07a;
				margin-top: 5px;
			}
			.nested-category-header::before {
				content: '▶';
				font-size: 7px;
				margin-right: 6px;
				transition: transform 0.3s;
			}
			.nested-category-header.open::before {
				transform: rotate(90deg);
			}
			.nested-category-items {
				padding-left: 20px;
				display: none;
				margin-top: 3px;
			}
			.nested-category-items.open {
				display: block;
			}

			/* Toggle Switches */
			.filter-option { display: flex; justify-content: flex-start; align-items: center; padding: 6px 0; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
			.filter-option input { display: none; }
			.toggle-btn {
			width: 30px; height: 16px; background: var(--bg-button, #1a1510); border: 1px solid var(--border-color, #4a3b2a);
			border-radius: 8px; position: relative; transition: 0.3s; margin-right: 10px; flex-shrink: 0;
			}
			.toggle-btn::after {
			content: ''; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
			background: var(--text-muted, #8a7a5f); border-radius: 50%; transition: 0.3s;
			}
			.filter-option input:checked + .toggle-btn { background: color-mix(in srgb, var(--border-highlight, #e2c07d) 15%, transparent); border-color: var(--border-highlight, #e2c07d); }
			.filter-option input:checked + .toggle-btn::after { transform: translateX(14px); background: var(--border-highlight, #e2c07d); }

			.node-icon { width: 20px; height: 20px; margin-right: 10px; object-fit: contain; }
			.label-text { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

			.hidden-node { display: none !important; }

			/* Premium Guild Wars 2 Black and Gold Custom Tooltip */
			[data-tooltip] {
				position: relative;
			}
			[data-tooltip]::before,
			[data-tooltip]::after {
				position: absolute;
				left: 50%;
				transform: translate(-50%, 10px);
				opacity: 0;
				transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
				pointer-events: none;
				z-index: 9999;
			}
			/* Tooltip text container */
			[data-tooltip]::before {
				content: attr(data-tooltip);
				bottom: 100%;
				margin-bottom: 8px;
				padding: 7px 11px;
				width: max-content;
				max-width: 240px;
				background: var(--bg-panel, rgba(10, 8, 5, 0.96));
				border: 1px solid var(--border-highlight, #e2c07d);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.85), inset 0 0 4px color-mix(in srgb, var(--border-highlight, #e2c07d) 15%, transparent);
				color: var(--text-primary, #e2c07d);
				font-size: 12px;
				font-family: "Crimson Text", serif;
				text-transform: none; /* Allows natural lowercase text reading */
				text-align: center;
				letter-spacing: 0.5px;
				line-height: 1.35;
				white-space: normal;
				border-radius: 3px;
			}
			/* Tooltip anchor arrow */
			[data-tooltip]::after {
				content: '';
				bottom: 100%;
				border-left: 6px solid transparent;
				border-right: 6px solid transparent;
				border-top: 6px solid var(--border-highlight, #e2c07d);
				margin-bottom: 2px;
			}
			/* Trigger tooltip on hover */
			[data-tooltip]:hover::before,
			[data-tooltip]:hover::after {
				opacity: 1;
				transform: translate(-50%, 0);
			}

			/* Color Picker and Swatches from map_options.html */
			.color-picker { display: flex; gap: 8px; padding: 0 0 10px 0; }
			.color-swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-color, #4a3b2a); cursor: pointer; transition: 0.2s; }
			.color-swatch:hover { border-color: var(--text-primary, #e2c07d); }
			.color-swatch.active { border-color: var(--text-primary, #e2c07d); box-shadow: 0 0 5px var(--text-primary, #e2c07d); transform: scale(1.2); }

			.category-disabled .category-items,
			.category-disabled .category-header {
				opacity: 0.45;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div class="search-container">
			<div class="search-wrapper">
				<input type="text" id="marker-search" placeholder="Search Markers..." autocomplete="off" oninput="handleSearch(this.value)">
					<span class="clear-search" id="clear-btn" onclick="clearSearch()">X</span>
				</div>
		</div>

		<div class="menu-content-wrapper">
			<div id="dynamic-sections-container"></div>
		</div>

		<script>
			/*<![CDATA[*/
			const mapUIKeys = ['region', 'map_text', 'sector', 'map_borders', 'farming_nodes'];

			async function loadDynamicSections() {
				try {
					const isDevMode = window.isDevMode === true || window.location.hostname === "localhost";
					const apiBase = isDevMode 
						? "https://gw2ps.local/Data/" 
						: "https://raw.githubusercontent.com/Yoast79/Tyrian-Lens/main/Data/";

					const response = await fetch(apiBase + "map_options_structure.json?t=" + Date.now());
					if (!response.ok) throw new Error("Failed to load map options structure");
					const sections = await response.json();

					const container = document.getElementById('dynamic-sections-container');
					let html = '';

					sections.forEach(section => {
						html += `<div id="section-${section.sectionId}">`;
						html += `  <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">`;
						html += `    <span>${section.sectionTitle}</span>`;
						html += `    <label class="filter-option" style="padding: 0; margin: 0;">`;
						html += `      <input type="checkbox" id="master-${section.sectionId}" onchange="toggleMasterCategory('${section.sectionId}', this.checked)">`;
						html += `      <div class="toggle-btn" style="margin-right: 0;"></div>`;
						html += `    </label>`;
						html += `  </div>`;

						if (section.categories) {
							section.categories.forEach(cat => {
								html += `  <div class="category-header" id="head-${cat.categoryId}" onclick="toggleCategory('cat-${cat.categoryId}')">${cat.categoryTitle}</div>`;
								html += `  <div class="category-items" id="cat-${cat.categoryId}">`;

								// Render direct items
								if (cat.items) {
									cat.items.forEach(item => {
										html += renderItemHtml(item);
									});
								}

								// Render subcategories
								if (cat.subcategories) {
									cat.subcategories.forEach(sub => {
										const subIconHtml = sub.icon ? `<img class="node-icon" src="${sub.icon}" style="vertical-align: middle; margin-right: 6px;">` : '';
										html += `    <div class="nested-category-header" id="head-${sub.subcategoryId}" onclick="toggleCategory('cat-${sub.subcategoryId}')">`;
										html += `      ${subIconHtml}`;
										html += `      <span style="font-size: 1.2em; vertical-align: middle;">${sub.subcategoryTitle}</span>`;
										html += `    </div>`;
										html += `    <div class="nested-category-items" id="cat-${sub.subcategoryId}">`;

										if (sub.items) {
											sub.items.forEach(item => {
												html += renderItemHtml(item);
											});
										}

										html += `    </div>`;
									});
								}

								html += `  </div>`;
							});
						}

						html += `</div>`;
					});

					container.innerHTML = html;

					// Initialize state of toggles AFTER DOM is built!
					initToggles();

				} catch (e) {
					console.error("Error loading dynamic sections:", e);
				}
			}

			function renderItemHtml(item) {
				const tooltipAttr = item.tooltip ? ` data-tooltip="${item.tooltip}"` : '';
				
				// For Pact Supply Agents, render it inline with its COPY button
				if (item.customAction === 'copyPSNA') {
					return `
					<div style="display: flex; align-items: center; gap: 5px;">
						<label class="filter-option"${tooltipAttr} style="flex-grow: 1;">
							<input type="checkbox" id="${item.id}" onchange="saveAndToggle('${item.id}', this.checked)">
							<div class="toggle-btn"></div>
							<img class="node-icon" src="${item.icon}">
							<span class="label-text">${item.label}</span>
						</label>
						<button class="copy-btn" title="Copy Waypoints" onclick="copyPSNAWaypoints()" style="background: #1a1510; border: 1px solid #4a3b2a; color: #e2c07d; padding: 2px 8px; cursor: pointer; font-size: 10px; border-radius: 3px;">
							COPY WAYPOINTS
						</button>
					</div>`;
				}

				// For Sector Borders, render with Color Picker
				if (item.hasColorPicker) {
					const iconHtml = item.icon ? `<img class="node-icon" src="${item.icon}">` : '';
					return `
					<div class="filter-option" style="padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 12px;">
						<label class="filter-option"${tooltipAttr} style="margin: 0; padding: 0; display: flex; align-items: center; flex-grow: 1;">
							<input type="checkbox" id="${item.id}" onchange="saveAndToggle('${item.id}', this.checked)">
							<div class="toggle-btn"></div>
							${iconHtml}
							<span class="label-text">${item.label}</span>
						</label>
						<div class="color-picker" id="${item.id}-color-picker" style="padding:0; margin:0; gap: 8px; flex-shrink: 0; display: flex; align-items: center;">
							<div class="color-swatch" data-color="#ff3333" style="background: #ff3333;" onclick="setItemColor('${item.id}', '#ff3333')"></div>
							<div class="color-swatch" data-color="#33ff33" style="background: #33ff33;" onclick="setItemColor('${item.id}', '#33ff33')"></div>
							<div class="color-swatch" data-color="#e2c07d" style="background: #e2c07d;" onclick="setItemColor('${item.id}', '#e2c07d')"></div>
							<div class="color-swatch" data-color="#00ffcc" style="background: #00ffcc;" onclick="setItemColor('${item.id}', '#00ffcc')"></div>
							<div class="color-swatch" data-color="#ff00ff" style="background: #ff00ff;" onclick="setItemColor('${item.id}', '#ff00ff')"></div>
						</div>
					</div>`;
				}

				// For Mastery Insights, render with "hide completed" checkbox
				if (item.id === 'mastery') {
					const iconHtml = item.icon ? `<img class="node-icon" src="${item.icon}">` : '';
					return `
					<div style="display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px;">
						<label class="filter-option"${tooltipAttr} style="margin: 0; padding: 6px 0; flex-grow: 1; display: flex; align-items: center;">
							<input type="checkbox" id="${item.id}" onchange="saveAndToggle('${item.id}', this.checked)">
							<div class="toggle-btn"></div>
							${iconHtml}
							<span class="label-text">${item.label}</span>
						</label>
						<label style="display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-muted, #8a7a5f); cursor: pointer; text-transform: uppercase; flex-shrink: 0; user-select: none;">
							<input type="checkbox" id="hide-completed-mastery" onchange="toggleHideCompletedMastery(this.checked)" style="display: inline-block; cursor: pointer; width: 12px; height: 12px; accent-color: var(--border-highlight, #e2c07d); margin: 0;">
							<span>hide completed</span>
						</label>
					</div>`;
				}

				// Standard items (with optional icons)
				const iconHtml = item.icon ? `<img class="node-icon" src="${item.icon}">` : '';
				return `
				<label class="filter-option"${tooltipAttr}>
					<input type="checkbox" id="${item.id}" onchange="saveAndToggle('${item.id}', this.checked)">
					<div class="toggle-btn"></div>
					${iconHtml}
					<span class="label-text">${item.label}</span>
				</label>`;
			}

			function toggleCategory(id) {
				const items = document.getElementById(id);
				const header = document.getElementById('head-' + id.split('-')[1]);

				items.classList.toggle('open');
				header.classList.toggle('open');

				// Save state
				let openCategories = JSON.parse(localStorage.getItem('gw2_marker_categories') || '[]');
				if (items.classList.contains('open')) {
					if (!openCategories.includes(id)) openCategories.push(id);
				} else {
					openCategories = openCategories.filter(cat => cat !== id);
				}
				localStorage.setItem('gw2_marker_categories', JSON.stringify(openCategories));
			}

			function handleSearch(val) {
				const query = val.toLowerCase();
				const clearBtn = document.getElementById('clear-btn');
				const options = document.querySelectorAll('.filter-option');
				const categories = document.querySelectorAll('.category-items, .nested-category-items');
				const headers = document.querySelectorAll('.category-header, .nested-category-header');

				clearBtn.style.display = query.length > 0 ? 'block' : 'none';

				if (query.length < 3) {
					// Restore normal view and previously open categories
					options.forEach(opt => opt.classList.remove('hidden-node'));
					categories.forEach(cat => cat.classList.remove('open'));
					headers.forEach(head => head.classList.remove('open'));
					restoreCategories();
					return;
				}

				// Search active: override memory and open matching categories
				options.forEach(opt => {
					const labelEl = opt.querySelector('.label-text');
					if (!labelEl) return;
					const text = labelEl.innerText.toLowerCase();
					if (text.includes(query)) {
						opt.classList.remove('hidden-node');
						opt.parentElement.classList.add('open');
						const headId = 'head-' + opt.parentElement.id.split('-')[1];
						const headEl = document.getElementById(headId);
						if (headEl) headEl.classList.add('open');
						
						// Also open grandparent category if it's a subcategory
						const grandParent = opt.parentElement.parentElement;
						if (grandParent && grandParent.classList.contains('nested-category-items')) {
							grandParent.classList.add('open');
							const gHeadId = 'head-' + grandParent.id.split('-')[1];
							const gHeadEl = document.getElementById(gHeadId);
							if (gHeadEl) gHeadEl.classList.add('open');
						}
					} else {
						opt.classList.add('hidden-node');
					}
				});
			}

			function clearSearch() {
				const input = document.getElementById('marker-search');
				input.value = '';
				handleSearch('');
				input.focus();
			}

			function saveAndToggle(name, isVisible) {
				let storageKey = mapUIKeys.includes(name) ? 'gw2_map_settings' : 'gw2_marker_settings';
				let settings = JSON.parse(localStorage.getItem(storageKey) || '{}');
				settings[name] = isVisible;
				localStorage.setItem(storageKey, JSON.stringify(settings));

				// Check if the parent category is currently turned ON
				const el = document.getElementById(name);
				let isMasterOn = true;
				if (el) {
					const sectionWrapper = el.closest('[id^="section-"]');
					if (sectionWrapper) {
						const sectionName = sectionWrapper.id.replace('section-', '');
						const masterToggles = JSON.parse(localStorage.getItem('gw2_master_toggles') || '{"map-options":true,"farming_nodes":true,"miscellaneous":true}');
						isMasterOn = masterToggles[sectionName] !== false;
					}
				}

				let finalVisible = isMasterOn && isVisible;
				window.parent.postMessage({ action: 'toggleMapLayer', name: name, isVisible: finalVisible }, '*');
			}

			function toggleHideCompletedMastery(checked) {
				localStorage.setItem('gw2_hide_completed_mastery', checked);
				window.parent.postMessage({ action: 'toggleHideCompletedMastery', isHidden: checked }, '*');
			}

			function setItemColor(itemId, color) {
				let highlightColors = JSON.parse(localStorage.getItem('gw2_highlight_colors') || '{}');
				
				if (highlightColors[itemId] === color) {
					delete highlightColors[itemId];
					color = null;
				} else {
					highlightColors[itemId] = color;
				}
				
				localStorage.setItem('gw2_highlight_colors', JSON.stringify(highlightColors));
				window.parent.postMessage({ action: 'changeItemHighlightColor', itemId: itemId, color: color }, '*');

				// Update active swatches for this item's color picker
				const picker = document.getElementById(`${itemId}-color-picker`);
				if (picker) {
					picker.querySelectorAll('.color-swatch').forEach(s => {
						if (color && s.dataset.color === color) s.classList.add('active');
						else s.classList.remove('active');
					});
				}
			}

			function setBorderColor(color) {
				setItemColor('map_borders', color);
			}

			function toggleMasterCategory(section, isChecked) {
				let masterToggles = JSON.parse(localStorage.getItem('gw2_master_toggles') || '{"map-options":true,"farming_nodes":true,"miscellaneous":true}');
				masterToggles[section] = isChecked;
				localStorage.setItem('gw2_master_toggles', JSON.stringify(masterToggles));

				if (section === 'farming_nodes') {
					let mapSettings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
					mapSettings['farming_nodes'] = isChecked;
					localStorage.setItem('gw2_map_settings', JSON.stringify(mapSettings));
				}

				const container = document.getElementById(`section-${section}`);
				if (container) {
					if (isChecked) container.classList.remove('category-disabled');
					else container.classList.add('category-disabled');

					// Update map layers for all children in this section
					const children = container.querySelectorAll(`input[type="checkbox"]:not(#master-${section})`);
					children.forEach(el => {
						let finalVisible = isChecked ? el.checked : false;
						window.parent.postMessage({ action: 'toggleMapLayer', name: el.id, isVisible: finalVisible }, '*');
					});
				}

				window.parent.postMessage({ action: 'toggleMapLayer', name: section, isVisible: isChecked }, '*');
			}

			function restoreCategories() {
				let openCategories = JSON.parse(localStorage.getItem('gw2_marker_categories') || '[]');
				openCategories.forEach(id => {
					let el = document.getElementById(id);
					let head = document.getElementById('head-' + id.split('-')[1]);
					if (el && head) {
						el.classList.add('open');
						head.classList.add('open');
					}
				});
			}

			// Disable right-click context menu (blocks "Inspect Element")
			document.addEventListener('contextmenu', event => event.preventDefault());

			function initToggles() {
				const mapSettings = JSON.parse(localStorage.getItem('gw2_map_settings') || '{}');
				const markerSettings = JSON.parse(localStorage.getItem('gw2_marker_settings') || '{}');
				const masterToggles = JSON.parse(localStorage.getItem('gw2_master_toggles') || '{"map-options":true,"farming_nodes":true,"miscellaneous":true}');

				// Force farming_nodes master toggle to true to ensure independent node toggles work flawlessly
				mapSettings['farming_nodes'] = true;

				const defaultOnMarkerKeys = ['poi', 'waypoint', 'vista', 'heart', 'heropoint', 'mastery', 'personal_markers', 'node_zone_portal', 'region', 'map_text', 'sector', 'map_borders'];

				// Loop through every checkbox (ignoring the master ones to avoid conflicts during load)
				document.querySelectorAll('.filter-option input[type="checkbox"]').forEach(el => {
					if (el.id.startsWith('master-')) return;

					const key = el.id;
					let isVisible;

					if (mapUIKeys.includes(key)) {
						isVisible = (mapSettings[key] !== undefined) ? mapSettings[key] : defaultOnMarkerKeys.includes(key);
						mapSettings[key] = isVisible;
					} else {
						if (markerSettings[key] !== undefined) {
							isVisible = markerSettings[key];
						} else {
							isVisible = defaultOnMarkerKeys.includes(key);
						}
						markerSettings[key] = isVisible;
					}

					el.checked = isVisible;

					const sectionWrapper = el.closest('[id^="section-"]');
					let isMasterOn = true;
					if (sectionWrapper) {
						const sectionName = sectionWrapper.id.replace('section-', '');
						isMasterOn = masterToggles[sectionName] !== false;
					}

					let finalVisible = isMasterOn && isVisible;
					window.parent.postMessage({ action: 'toggleMapLayer', name: key, isVisible: finalVisible }, '*');
				});

				localStorage.setItem('gw2_map_settings', JSON.stringify(mapSettings));
				localStorage.setItem('gw2_marker_settings', JSON.stringify(markerSettings));

				const highlightColors = JSON.parse(localStorage.getItem('gw2_highlight_colors') || '{}');
				// Backward compatibility: read old borderColor for map_borders
				if (!highlightColors['map_borders'] && mapSettings.borderColor) {
					highlightColors['map_borders'] = mapSettings.borderColor;
					localStorage.setItem('gw2_highlight_colors', JSON.stringify(highlightColors));
				}

				Object.keys(highlightColors).forEach(itemId => {
					const color = highlightColors[itemId];
					const picker = document.getElementById(`${itemId}-color-picker`);
					if (picker && color) {
						picker.querySelectorAll('.color-swatch').forEach(s => {
							if (s.dataset.color === color) s.classList.add('active');
							else s.classList.remove('active');
						});
					}
				});

				['map-options', 'farming_nodes', 'miscellaneous'].forEach(section => {
					const isChecked = masterToggles[section] !== false;
					const masterEl = document.getElementById(`master-${section}`);
					if (masterEl) masterEl.checked = isChecked;

					const container = document.getElementById(`section-${section}`);
					if (container) {
						if (isChecked) container.classList.remove('category-disabled');
						else container.classList.add('category-disabled');
					}
				});

				restoreCategories();
				document.body.setAttribute('data-theme', localStorage.getItem('gw2_theme') || 'human');

				// Initialize hide completed mastery checkbox state
				const hideCompleted = localStorage.getItem('gw2_hide_completed_mastery') === 'true';
				const hideCheckbox = document.getElementById('hide-completed-mastery');
				if (hideCheckbox) hideCheckbox.checked = hideCompleted;
				window.parent.postMessage({ action: 'toggleHideCompletedMastery', isHidden: hideCompleted }, '*');
			}

			window.onload = () => {
				loadDynamicSections();
			};

			window.addEventListener('message', (e) => {
				if (e.data.action === 'updateTheme') {
					document.body.setAttribute('data-theme', e.data.theme);
				}
			});
			/*]]>*/
		</script>

			async function copyPSNAWaypoints() {
				window.parent.postMessage({ action: 'toast', msg: 'SYNCING WITH ROTATION TABLE...' }, "*");

				const rotation = {
					0: ["[\x26BIkHAAA=]", "[\x26BDoBAAA=]", "[\x26BO4CAAA=]", "[\x26BC0AAAA=]", "[\x26BIUCAAA=]", "[\x26BCECAAA=]"],
					1: ["[\x26BIcHAAA=]", "[\x26BEwDAAA=]", "[\x26BNIEAAA=]", "[\x26BKYBAAA=]", "[\x26BIMCAAA=]", "[\x26BA8CAAA=]"],
					2: ["[\x26BH8HAAA=]", "[\x26BEgAAAA=]", "[\x26BKgCAAA=]", "[\x26BBEAAAA=]", "[\x26BGQCAAA=]", "[\x26BIMBAAA=]"],
					3: ["[\x26BHoHAAA=]", "[\x26BLQDAAA=]", "[\x26BCEDAAA=]", "[\x26BKYAAAA=]", "[\x26BLQAAAA=]", "[\x26BFEDAAA=]"],
					4: ["[\x26BH8HAAA=]", "[\x26BF0AAAA=]", "[\x26BO4CAAA=]", "[\x26BEUDAAA=]", "[\x26BJcBAAA=]", "[\x26BOcBAAA=]"],
					5: ["[\x26BJcHAAA=]", "[\x26BMwCAAA=]", "[\x26BKYCAAA=]", "[\x26BNUGAAA=]", "[\x26BHsBAAA=]", "[\x26BNMAAAA=]"],
					6: ["[\x26BH8HAAA=]", "[\x26BNMCAAA=]", "[\x26BB8DAAA=]", "[\x26BJIBAAA=]", "[\x26BE8CAAA=]", "[\x26BF8BAAA=]"]
				};

				try {
					const now = new Date();
					let utcDay = now.getUTCDay();
					let utcHours = now.getUTCHours();

					if (utcHours < 8) {
						utcDay = (utcDay === 0) ? 6 : utcDay - 1;
					}

					const todayCodes = rotation[utcDay];

					if (todayCodes) {
						const finalString = todayCodes.join("");
						await navigator.clipboard.writeText(finalString);
						window.parent.postMessage({ action: 'toast', msg: 'COPIED 6 WAYPOINTS' }, "*");
					} else {
						throw new Error("Invalid day mapping");
					}
				} catch (e) {
					console.error("PSNA Sync Error:", e);
					window.parent.postMessage({ action: 'toast', msg: 'ROTATION SYNC ERROR' }, "*");
				}
			}
			/*]]>*/
		</script>
