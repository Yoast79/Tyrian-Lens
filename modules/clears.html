<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="https://gw2ps.local/Assets/core.css" />
		<style>
			::-webkit-scrollbar { width: 6px; }
			::-webkit-scrollbar-track { background: var(--bg-panel, rgba(10,8,5,0.5)); }
			::-webkit-scrollbar-thumb { background: var(--border-color, #4a3b2a); border-radius: 3px; }
			* { cursor: url("https://gw2ps.local/Assets/Icons/mouse_cursor.png"), auto !important; margin: 0; padding: 0; box-sizing: border-box; }
			body { background: transparent; color: var(--text-primary, #e2c07d); font-family: "Crimson Text", serif; padding: 15px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; text-transform: uppercase; }

			.header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color, #4a3b2a); padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0; }
			.section-title { font-size: 16px; letter-spacing: 2px; color: var(--text-muted, #8a7a5f); font-weight: bold; margin: 0; }

			.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text-primary, #e2c07d); letter-spacing: 3px; font-size: 16px; font-weight: bold; height: 100%; }
			.loading img { width: 400px; height: 400px; margin-bottom: 30px; object-fit: contain; }

			.clear-cat { margin-bottom: 15px; border: 1px solid var(--border-color, #2a2015); background: rgba(0,0,0,0.3); }
			.cat-header { background: var(--bg-button, #1a1510); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid var(--border-color, #2a2015); }
			.cat-header:hover { border-color: var(--border-highlight, #e2c07d) !important; box-shadow: inset 0 0 0 1px var(--border-highlight, #e2c07d); }
			.cat-title { font-size: 12px; letter-spacing: 1px; color: var(--text-primary, #e2c07d); font-weight: bold; }
			.cat-content { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

			.sub-cat { margin-bottom: 5px; border: 1px solid var(--border-color, #332a1e); background: rgba(0,0,0,0.2); }
			.sub-header { background: var(--bg-panel, rgba(20,15,10,0.8)); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
			.sub-header:hover { border-color: var(--border-highlight, #e2c07d) !important; box-shadow: inset 0 0 0 1px var(--border-highlight, #e2c07d); }
			.sub-title { font-size: 11px; color: var(--text-primary, #e2c07d); font-weight: bold; text-transform: uppercase; }
			.progress-text { font-size: 11px; color: var(--text-muted, #8a7a5f); font-weight: bold; }
			.progress-done { color: #1A9306; font-size: 14px; line-height: 1; }

			.clear-item { display: flex; justify-content: space-between; padding: 8px 12px; background: rgba(10,8,5,0.4); border-top: 1px solid var(--border-color, #2a2015); align-items: center; cursor: pointer; transition: 0.2s; }
			.clear-item:first-child { border-top: none; }
			.clear-item:hover { border-color: var(--border-highlight, #e2c07d) !important; box-shadow: inset 0 0 0 1px var(--border-highlight, #e2c07d); }
			.clear-item-left { display: flex; align-items: center; gap: 8px; }
			.clear-name { font-size: 11px; color: var(--text-primary, #e2c07d); transition: 0.2s; }

			.watch-star { font-size: 14px; color: var(--text-muted, #8a7a5f); transition: 0.2s; cursor: pointer; user-select: none; line-height: 1; }
			.watch-star:hover { color: var(--text-primary, #e2c07d); transform: scale(1.2); }
			.watch-star.active { color: #ffd700 !important; text-shadow: 0 0 5px #ffd700; }

			.clear-status { font-size: 10px; font-weight: bold; }
			.status-done { color: #1A9306; }
			.status-uncleared { color: #ff4a4a; }

			/* Large UI Scaling Overrides */
			body.ui-large .section-title { font-size: 20px; }
			body.ui-large .cat-title { font-size: 14px; }
			body.ui-large .sub-title { font-size: 13px; }
			body.ui-large .clear-name { font-size: 14px; }
			body.ui-large .clear-status { font-size: 12px; }
			body.ui-large .progress-text { font-size: 13px; }
			body.ui-large .progress-done { font-size: 16px; }
			body.ui-large .watch-star { font-size: 17px; }
		</style>
	</head>
	<body>
		<div id="ui-root" style="display:none; height:100%; flex-direction: column;">
			<div class="header-row">
				<div class="section-title">Weekly Clears</div>
				<button style="background: var(--bg-button, #1a1510); border: 1px solid var(--border-color, #4a3b2a); color: var(--text-muted, #8a7a5f); padding: 4px 8px; font-size: 9px; cursor: pointer; transition: 0.2s; font-family: inherit; text-transform: uppercase;" onmouseover="this.style.borderColor='var(--text-primary, #e2c07d)'; this.style.color='var(--text-primary, #e2c07d)';" onmouseout="this.style.borderColor='var(--border-color, #4a3b2a)'; this.style.color='var(--text-muted, #8a7a5f)';" onclick="init()">Refresh</button>
			</div>
			<div id="clears-container" style="flex: 1 1 auto; overflow-y: auto; padding-right: 5px;"></div>
		</div>

		<div id="loader" class="loading">
			<img src="https://gw2ps.local/Assets/Icons/Tyrian_Lens_transparent.png" />
			<div>SYNCING CLEARS DATA...</div>
		</div>

		<script>
			/*<![CDATA[*/
			document.body.setAttribute('data-theme', localStorage.getItem('gw2_theme') || 'human');
            let activeKey = localStorage.getItem('gw2_active_key');

            async function fetchJSON(url) {
                try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch(e) { return null; }
            }

            function formatName(str) {
                return str.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            }

            window.toggleWatch = function(e, id, name, cat) {
                e.stopPropagation();
                let watched = JSON.parse(localStorage.getItem('gw2_watched_clears') || '[]');
                const star = e.currentTarget;
                
                if (watched.includes(id)) {
                    watched = watched.filter(wId => wId !== id);
                    star.classList.remove('active');
                    star.innerHTML = '☆';
                } else {
                    watched.push(id);
                    star.classList.add('active');
                    star.innerHTML = '★';
                    localStorage.setItem('gw2_clears_watchlist_visible', 'true');
                }
                
                localStorage.setItem('gw2_watched_clears', JSON.stringify(watched));
                window.parent.postMessage({ action: 'refreshClearsWatchlist' }, '*');
            };

            async function init(isAutoRefresh = false) {
                const settings = JSON.parse(localStorage.getItem('gw2_settings') || '{}');
                if (settings.uiScaleLarge) document.body.classList.add('ui-large');
                
                if (!activeKey) return;

                if (!isAutoRefresh) {
                    document.getElementById('loader').style.display = 'flex';
                    document.getElementById('ui-root').style.display = 'none';
                    const container = document.getElementById('clears-container');
                    container.innerHTML = '';
                }

                const [allRaids, accRaids, accStrikes, allDungeons, accDungeons, accAchievements] = await Promise.all([
                    fetchJSON('https://api.guildwars2.com/v2/raids?ids=all'),
                    fetchJSON(`https://api.guildwars2.com/v2/account/raids?access_token=${activeKey}`),
                    fetchJSON(`https://api.guildwars2.com/v2/account/strikes?access_token=${activeKey}`),
                    fetchJSON('https://api.guildwars2.com/v2/dungeons?ids=all'),
                    fetchJSON(`https://api.guildwars2.com/v2/account/dungeons?access_token=${activeKey}`),
                    fetchJSON(`https://api.guildwars2.com/v2/account/achievements?access_token=${activeKey}`)
                ]);

                let clearsStatus = {};
                let watched = JSON.parse(localStorage.getItem('gw2_watched_clears') || '[]');

                // RAIDS
                let raidsHtml = '';
                let wingNum = 1;
                if (allRaids) {
                    allRaids.forEach(r => {
                        r.wings.forEach(w => {
                            let wingCleared = 0;
                            let wingTotal = w.events.length;
                            let eventsHtml = '';
                            
                            w.events.forEach(e => {
                                const isDone = accRaids && accRaids.includes(e.id);
                                if (isDone) wingCleared++;
                                
                                const displayName = formatName(e.id);
                                clearsStatus[e.id] = { name: displayName, isDone: isDone, cat: 'RAIDS' };
                                const isWatched = watched.includes(e.id);

                                eventsHtml += `
                                <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${displayName}' }, '*')">
                                    <div class="clear-item-left">
                                        <span class="watch-star ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${e.id}', '${displayName}', 'RAIDS')">${isWatched ? '★' : '☆'}</span>
                                        <span class="clear-name">${displayName}</span>
                                    </div>
                                    <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${isDone ? 'CLEARED' : 'UNCLEARED'}</span>
                                </div>`;
                            });

                            let progressHtml = wingCleared === wingTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${wingCleared}/${wingTotal}</span>`;

                            raidsHtml += `
                            <div class="sub-cat">
                                <div class="sub-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';">
                                    <span class="sub-title">Wing ${wingNum}: ${formatName(w.id)}</span>
                                    ${progressHtml}
                                </div>
                                <div class="cat-content" style="display:none; padding:0; gap:0;">
                                    ${eventsHtml}
                                </div>
                            </div>`;
                            wingNum++;
                        });
                    });
                }
                
                let combinedHtml = `
                <div class="clear-cat">
                    <div class="cat-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';"><span class="cat-title">RAIDS</span></div>
                    <div class="cat-content" style="padding:10px;">${raidsHtml || '<div style="font-size:11px; color:#8a7a5f;">Failed to load raids.</div>'}</div>
                </div>`;

                // STRIKES
                const strikeCats = {
                    "Icebrood Saga": ["shiverpeaks_pass", "voice_and_claw", "fraenir_of_jormag", "boneskinner", "whisper_of_jormag", "cold_war"],
                    "End of Dragons": ["aetherblade_hideout", "xunlai_jade_junkyard", "kaineng_overlook", "harvest_temple", "old_lions_court"],
                    "Secrets of the Obscure": ["cosmic_observatory", "temple_of_febe"]
                };
                
                let strikesHtml = '';
                for (const [catName, strikes] of Object.entries(strikeCats)) {
                    let catCleared = 0;
                    let catTotal = strikes.length;
                    let sHtml = '';
                    
                    strikes.forEach(s => {
                        const isDone = accStrikes && accStrikes.includes(s);
                        if (isDone) catCleared++;

                        const displayName = formatName(s);
                        clearsStatus[s] = { name: displayName, isDone: isDone, cat: 'STRIKES' };
                        const isWatched = watched.includes(s);

                        sHtml += `
                        <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${displayName}' }, '*')">
                            <div class="clear-item-left">
                                <span class="watch-star ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${s}', '${displayName}', 'STRIKES')">${isWatched ? '★' : '☆'}</span>
                                <span class="clear-name">${displayName}</span>
                            </div>
                            <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${isDone ? 'CLEARED' : 'UNCLEARED'}</span>
                        </div>`;
                    });

                    let progressHtml = catCleared === catTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${catCleared}/${catTotal}</span>`;

                    strikesHtml += `
                    <div class="sub-cat">
                        <div class="sub-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';">
                            <span class="sub-title">${catName}</span>
                            ${progressHtml}
                        </div>
                        <div class="cat-content" style="display:none; padding:0; gap:0;">
                            ${sHtml}
                        </div>
                    </div>`;
                }

                combinedHtml += `
                <div class="clear-cat">
                    <div class="cat-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';"><span class="cat-title">STRIKE MISSIONS</span></div>
                    <div class="cat-content" style="padding:10px;">${strikesHtml}</div>
                </div>`;

                // DUNGEONS
                let dungeonsHtml = '';
                if (allDungeons) {
                    allDungeons.forEach(d => {
                        let dCleared = 0;
                        let dTotal = d.paths.length;
                        let pHtml = '';

                        d.paths.forEach(p => {
                            const isDone = accDungeons && accDungeons.includes(p.id);
                            if (isDone) dCleared++;
                            
                            let pathName = '';
                            let dName = formatName(d.id);
                            if (p.type === 'Story') pathName = dName + ' Story';
                            else {
                                let pNum = p.id.match(/\d+$/);
                                if (pNum) pathName = dName + ' Path ' + pNum[0];
                                else pathName = formatName(p.id);
                            }

                            clearsStatus[p.id] = { name: pathName, isDone: isDone, cat: 'DUNGEONS' };
                            const isWatched = watched.includes(p.id);

                            pHtml += `
                            <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${pathName}' }, '*')">
                                <div class="clear-item-left">
                                    <span class="watch-star ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${p.id}', '${pathName}', 'DUNGEONS')">${isWatched ? '★' : '☆'}</span>
                                    <span class="clear-name">${pathName}</span>
                                </div>
                                <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${isDone ? 'CLEARED' : 'UNCLEARED'}</span>
                            </div>`;
                        });

                        let progressHtml = dCleared === dTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${dCleared}/${dTotal}</span>`;

                        dungeonsHtml += `
                        <div class="sub-cat">
                            <div class="sub-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';">
                                <span class="sub-title">${formatName(d.id)}</span>
                                ${progressHtml}
                            </div>
                            <div class="cat-content" style="display:none; padding:0; gap:0;">
                                ${pHtml}
                            </div>
                        </div>`;
                    });
                }

                combinedHtml += `
                <div class="clear-cat">
                    <div class="cat-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';"><span class="cat-title">DUNGEONS</span></div>
                    <div class="cat-content" style="padding:10px;">${dungeonsHtml || '<div style="font-size:11px; color:#8a7a5f;">Failed to load dungeons.</div>'}</div>
                </div>`;

                // WEEKLY RIFTS
                const RIFT_ROTATION = {
                    1: [ { name: "Straits of Devastation", id: 7067 }, { name: "Elon Riverlands", id: 7060 }, { name: "Domain of Istan", id: 7028 } ],
                    2: [ { name: "Sparkfly Fen", id: 7247 }, { name: "Tangled Depths", id: 6996 }, { name: "Sandswept Isles", id: 7181 } ],
                    3: [ { name: "Bloodtide Coast", id: 7109 }, { name: "Lake Doric", id: 7108 }, { name: "Domain of Vabbi", id: 7023 } ],
                    4: [ { name: "Frostgorge Sound", id: 7620 }, { name: "Ember Bay", id: 7628 }, { name: "Seitung Province", id: 7634 } ],
                    5: [ { name: "Iron Marches", id: 7607 }, { name: "Verdant Brink", id: 7602 }, { name: "Bitterfrost Frontier", id: 7618 } ],
                    6: [ { name: "Mount Maelstrom", id: 7061 }, { name: "Jahai Bluffs", id: 7704 }, { name: "New Kaineng City", id: 7662 } ],
                    7: [ { name: "Malchor's Leap", id: 7713 }, { name: "Bloodstone Fen", id: 7692 }, { name: "Desert Highlands", id: 7659 } ],
                    8: [ { name: "Fireheart Rise", id: 7660 }, { name: "Dry Top", id: 7679 }, { name: "Auric Basin", id: 7663 } ],
                    9: [ { name: "Cursed Shore", id: 7168 }, { name: "Southsun Cove", id: 7040 }, { name: "Crystal Oasis", id: 7088 } ],
                    10: [ { name: "Mount Maelstrom", id: 7061 }, { name: "Lake Doric", id: 7108 }, { name: "Domain of Vabbi", id: 7023 } ],
                    11: [ { name: "Timberline Falls", id: 7064 }, { name: "Thunderhead Peaks", id: 7078 }, { name: "Echovald Wilds", id: 7044 } ]
                };

                const RIFT_SOTO_PERM = [
                    { name: "Skywatch Archipelago", id: 7075 },
                    { name: "Amnytas", id: 7072 },
                    { name: "Inner Nayos", id: 7655 }
                ];

                const RIFT_JW_PERM = [
                    { name: "Lowland Shore", id: 8201 },
                    { name: "Janthir Syntri", id: 8257 },
                    { name: "Mistburned Barrens", id: 8571 },
                    { name: "Bava Nisos", id: 8766 }
                ];

                function getWeeklyRotationWeekIndex() {
                    const epoch = Date.UTC(2023, 10, 6, 7, 30, 0); // Monday Nov 6, 2023 07:30 UTC
                    const now = Date.now();
                    const elapsedWeeks = (now - epoch) / (7 * 24 * 60 * 60 * 1000);
                    return (Math.floor(elapsedWeeks) % 11) + 1;
                }

                let riftsHtml = '';
                const wIdx = getWeeklyRotationWeekIndex();
                const activeRotating = RIFT_ROTATION[wIdx] || [];
                const sotoActiveMaps = [...RIFT_SOTO_PERM, ...activeRotating];
                
                // Group 1: Secrets of the Obscure & Core
                let sotoCleared = 0;
                let sotoTotal = sotoActiveMaps.length;
                let sotoHtml = '';
                
                sotoActiveMaps.forEach(m => {
                    const playerProg = accAchievements ? accAchievements.find(a => a.id === m.id) : null;
                    const isDone = playerProg ? playerProg.done : false;
                    if (isDone) sotoCleared++;
                    
                    const progressCount = playerProg ? playerProg.current : 0;
                    const maxCount = playerProg ? playerProg.max : 5;
                    const statusText = isDone ? 'CLEARED (5/5)' : `${progressCount}/${maxCount} UNCLEARED`;
                    
                    const riftName = m.name + " Rift";
                    clearsStatus[m.id] = { name: riftName, isDone: isDone, cat: 'RIFTS' };
                    const isWatched = watched.includes(m.id);

                    sotoHtml += `
                    <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${m.name}' }, '*')">
                        <div class="clear-item-left">
                            <span class="watch-star ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${m.id}', '${riftName}', 'RIFTS')">${isWatched ? '★' : '☆'}</span>
                            <span class="clear-name">${m.name}</span>
                        </div>
                        <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${statusText}</span>
                    </div>`;
                });

                let sotoProgressHtml = sotoCleared === sotoTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${sotoCleared}/${sotoTotal}</span>`;

                riftsHtml += `
                <div class="sub-cat">
                    <div class="sub-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';">
                        <span class="sub-title">Secrets of the Obscure & Core (Week ${wIdx})</span>
                        ${sotoProgressHtml}
                    </div>
                    <div class="cat-content" style="display:none; padding:0; gap:0;">
                        ${sotoHtml}
                    </div>
                </div>`;

                // Group 2: Janthir Wilds
                let jwCleared = 0;
                let jwTotal = RIFT_JW_PERM.length;
                let jwHtml = '';
                
                RIFT_JW_PERM.forEach(m => {
                    const playerProg = accAchievements ? accAchievements.find(a => a.id === m.id) : null;
                    const isDone = playerProg ? playerProg.done : false;
                    if (isDone) jwCleared++;
                    
                    const progressCount = playerProg ? playerProg.current : 0;
                    const maxCount = playerProg ? playerProg.max : 5;
                    const statusText = isDone ? 'CLEARED (5/5)' : `${progressCount}/${maxCount} UNCLEARED`;
                    
                    const riftName = m.name + " Rift";
                    clearsStatus[m.id] = { name: riftName, isDone: isDone, cat: 'RIFTS' };
                    const isWatched = watched.includes(m.id);

                    jwHtml += `
                    <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${m.name}' }, '*')">
                        <div class="clear-item-left">
                            <span class="watch-star ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${m.id}', '${riftName}', 'RIFTS')">${isWatched ? '★' : '☆'}</span>
                            <span class="clear-name">${m.name}</span>
                        </div>
                        <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${statusText}</span>
                    </div>`;
                });

                let jwProgressHtml = jwCleared === jwTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${jwCleared}/${jwTotal}</span>`;

                riftsHtml += `
                <div class="sub-cat">
                    <div class="sub-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';">
                        <span class="sub-title">Janthir Wilds</span>
                        ${jwProgressHtml}
                    </div>
                    <div class="cat-content" style="display:none; padding:0; gap:0;">
                        ${jwHtml}
                    </div>
                </div>`;

                combinedHtml += `
                <div class="clear-cat">
                    <div class="cat-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none';"><span class="cat-title">WEEKLY RIFT HUNTING</span></div>
                    <div class="cat-content" style="padding:10px;">${riftsHtml}</div>
                </div>`;

                // Save dynamic API state into local storage to support the parent overlay
                localStorage.setItem('gw2_clears_status', JSON.stringify(clearsStatus));
                window.parent.postMessage({ action: 'refreshClearsWatchlist' }, '*');

                const container = document.getElementById('clears-container');
                container.innerHTML = combinedHtml;

                if (!isAutoRefresh) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('ui-root').style.display = 'flex';
                }
            }

            window.addEventListener('message', (e) => { 
                if (e.data && e.data.action === 'switchAccount') { activeKey = e.data.apiKey; init(); } 
                if (e.data && e.data.action === 'uiScaleChanged') {
                    if (e.data.value === 'large') document.body.classList.add('ui-large');
                    else document.body.classList.remove('ui-large');
                }
                if (e.data && e.data.action === 'updateTheme') {
                    document.body.setAttribute('data-theme', e.data.theme);
                }
                if (e.data && e.data.action === 'clearsWatchlistClosed') {
                    // Update star displays to reflect closing/unwatching
                    init(true);
                }
            });

            function getNextWeeklyReset() {
                const now = new Date();
                const reset = new Date();
                reset.setUTCHours(7, 30, 0, 0);
                
                const day = now.getUTCDay();
                let daysToMonday = (1 - day + 7) % 7;
                if (daysToMonday === 0 && (now.getUTCHours() > 7 || (now.getUTCHours() === 7 && now.getUTCMinutes() >= 30))) {
                    daysToMonday = 7;
                }
                reset.setUTCDate(now.getUTCDate() + daysToMonday);
                return reset;
            }

            let nextResetTime = getNextWeeklyReset().getTime();
            setInterval(() => {
                if (Date.now() >= nextResetTime) {
                    nextResetTime = getNextWeeklyReset().getTime();
                    init();
                }
            }, 60000); // Check reset every minute

            // Auto-refresh the clears data in background every minute while the document is active
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    init(true);
                }
            }, 60000);

            init();
            /*]]>*/
		</script>
