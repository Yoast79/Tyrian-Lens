<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="https://gw2ps.local/Assets/core.css" />
		<style>
			::-webkit-scrollbar { width: 6px; }
			::-webkit-scrollbar-track { background: var(--bg-panel, rgba(10,8,5,0.5)); }
			::-webkit-scrollbar-thumb { background: var(--border-color, #4a3b2a); border-radius: 3px; }
			* { cursor: url("https://gw2ps.local/Assets/Icons/mouse_cursor.png"), auto !important; margin: 0; padding: 0; box-sizing: border-box; }
			body { background: transparent; color: var(--text-primary, #e2c07d); font-family: "Crimson Text", serif; padding: 15px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; text-transform: uppercase; }

			.header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color, #4a3b2a); padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0; }
			.section-title { font-size: 16px; letter-spacing: 2px; color: var(--text-muted, #8a7a5f); font-weight: bold; margin: 0; }

			.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text-primary, #e2c07d); letter-spacing: 3px; font-size: 16px; font-weight: bold; height: 100%; }
			.loading img { width: 400px; height: 400px; margin-bottom: 30px; object-fit: contain; }

			.clear-cat { margin-bottom: 15px; border: 1px solid var(--border-color, #2a2015); background: rgba(0,0,0,0.3); }
			.cat-header { background: var(--bg-button, #1a1510); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid var(--border-color, #2a2015); }
			.cat-header:hover { border-color: var(--border-highlight, #e2c07d) !important; box-shadow: inset 0 0 0 1px var(--border-highlight, #e2c07d); }
			.cat-title { font-size: 12px; letter-spacing: 1px; color: var(--text-primary, #e2c07d); font-weight: bold; }
			.cat-content { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

			.sub-cat { margin-bottom: 5px; border: 1px solid var(--border-color, #332a1e); background: rgba(0,0,0,0.2); }
			.sub-header { background: var(--bg-panel, rgba(20,15,10,0.8)); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
			.sub-header:hover { border-color: var(--border-highlight, #e2c07d) !important; box-shadow: inset 0 0 0 1px var(--border-highlight, #e2c07d); }
			.sub-title { font-size: 11px; color: var(--text-primary, #e2c07d); font-weight: bold; text-transform: uppercase; }
			.progress-text { font-size: 11px; color: var(--text-muted, #8a7a5f); font-weight: bold; }
			.progress-done { color: #1A9306; font-size: 14px; line-height: 1; }

			.clear-item { display: flex; justify-content: space-between; padding: 8px 12px; background: rgba(10,8,5,0.4); border-top: 1px solid var(--border-color, #2a2015); align-items: center; cursor: pointer; transition: 0.2s; }
			.clear-item:first-child { border-top: none; }
			.clear-item:hover { border-color: var(--border-highlight, #e2c07d) !important; box-shadow: inset 0 0 0 1px var(--border-highlight, #e2c07d); }
			.clear-item-left { display: flex; align-items: center; gap: 8px; }
			.clear-name { font-size: 11px; color: var(--text-primary, #e2c07d); transition: 0.2s; }

			.star-btn { cursor: pointer; width: 16px; height: 16px; opacity: 0.3; transition: 0.2s; background: url("https://wiki.guildwars2.com/images/4/40/X-Ray_Vision_toggle_on.png") center/contain no-repeat; z-index: 10; flex-shrink: 0; display: inline-block; }
			.star-btn:hover { opacity: 0.7; transform: scale(1.1); }
			.star-btn.active { opacity: 1 !important; }

			.clear-status { font-size: 10px; font-weight: bold; }
			.status-done { color: #1A9306; }
			.status-uncleared { color: #ff4a4a; }

			/* Compact Toggles */
			.fancy-toggle { position: relative; display: inline-block; width: 28px; height: 14px; vertical-align: middle; }
			.fancy-toggle input { opacity: 0; width: 0; height: 0; }
			.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-button, #1a1510); border: 1px solid var(--border-color, #4a3b2a); transition: .3s; border-radius: 20px; }
			.slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 2px; bottom: 1px; background-color: var(--border-color, #4a3b2a); transition: .3s; border-radius: 50%; }
			input:checked + .slider { background-color: var(--text-primary, #e2c07d); border-color: var(--text-primary, #e2c07d); }
			input:checked + .slider:before { transform: translateX(13px); background-color: #000; }

			/* Large UI Scaling Overrides */
			body.ui-large .section-title { font-size: 20px; }
			body.ui-large .cat-title { font-size: 14px; }
			body.ui-large .sub-title { font-size: 13px; }
			body.ui-large .clear-name { font-size: 14px; }
			body.ui-large .clear-status { font-size: 12px; }
			body.ui-large .progress-text { font-size: 13px; }
			body.ui-large .progress-done { font-size: 16px; }
			body.ui-large .star-btn { width: 20px; height: 20px; }
			body.ui-large .fancy-toggle { width: 34px; height: 18px; }
			body.ui-large .slider:before { height: 14px; width: 14px; left: 2px; bottom: 1px; }
			body.ui-large input:checked + .slider:before { transform: translateX(16px); }
		</style>
	</head>
	<body>
		<div id="ui-root" style="display:none; height:100%; flex-direction: column;">
			<div class="header-row">
				<div class="section-title">Weekly Clears</div>
				<div style="display: flex; align-items: center; gap: 15px;">
					<div style="display: flex; align-items: center; gap: 8px;">
						<span style="font-size: 10px; font-weight: bold; color: var(--text-muted, #8a7a5f); letter-spacing: 1px;">Watchlist on Screen</span>
						<label class="fancy-toggle">
							<input type="checkbox" id="clears-watchlist-toggle" onchange="toggleWatchlistOnScreen(this.checked)" />
							<span class="slider"></span>
						</label>
					</div>
					<button style="background: var(--bg-button, #1a1510); border: 1px solid var(--border-color, #4a3b2a); color: var(--text-primary, #e2c07d); padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit; text-transform: uppercase; letter-spacing: 1px;" onmouseover="this.style.borderColor='var(--text-primary, #e2c07d)'; this.style.color='#fff';" onmouseout="this.style.borderColor='var(--border-color, #4a3b2a)'; this.style.color='var(--text-primary, #e2c07d)';" onclick="showWatchlistModal()">Watchlist</button>
				</div>
			</div>
			<div id="clears-container" style="flex: 1 1 auto; overflow-y: auto; padding-right: 5px;"></div>
		</div>

		<div id="watchlist-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,8,5,0.95); z-index:1000; padding:15px; flex-direction:column; border:1px solid var(--border-color, #4a3b2a);">
			<div class="header-row">
				<div class="section-title">Watchlist Overview</div>
				<button style="background: var(--bg-button, #1a1510); border: 1px solid var(--border-color, #4a3b2a); color: var(--text-muted, #8a7a5f); padding: 4px 8px; font-size: 9px; cursor: pointer; transition: 0.2s; font-family: inherit; text-transform: uppercase;" onmouseover="this.style.borderColor='var(--text-primary, #e2c07d)'; this.style.color='var(--text-primary, #e2c07d)';" onmouseout="this.style.borderColor='var(--border-color, #4a3b2a)'; this.style.color='var(--text-muted, #8a7a5f)';" onclick="closeWatchlistModal()">Close</button>
			</div>
			<div id="watchlist-modal-content" style="flex: 1 1 auto; overflow-y: auto; padding-right: 5px;"></div>
		</div>

		<div id="loader" class="loading">
			<img src="https://gw2ps.local/Assets/Icons/Tyrian_Lens_transparent.png" />
			<div>SYNCING CLEARS DATA...</div>
		</div>

		<script>
			/*<![CDATA[*/
			document.body.setAttribute('data-theme', localStorage.getItem('gw2_theme') || 'human');
            let activeKey = localStorage.getItem('gw2_active_key');

            async function fetchJSON(url, timeoutMs = 8000) {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const r = await fetch(url, { signal: controller.signal });
                    clearTimeout(id);
                    return r.ok ? await r.json() : null;
                } catch(e) {
                    clearTimeout(id);
                    return null;
                }
            }

            function formatName(str) {
                return str.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            }

            window.toggleWatch = function(e, id, name, cat) {
                e.stopPropagation();
                let watched = JSON.parse(localStorage.getItem('gw2_watched_clears') || '[]');
                const star = e.currentTarget;
                
                if (watched.includes(id)) {
                    watched = watched.filter(wId => wId !== id);
                    star.classList.remove('active');
                } else {
                    watched.push(id);
                    star.classList.add('active');
                    localStorage.setItem('gw2_clears_watchlist_visible', 'true');
                }
                
                localStorage.setItem('gw2_watched_clears', JSON.stringify(watched));
                window.parent.postMessage({ action: 'refreshClearsWatchlist' }, '*');
            };

            window.showWatchlistModal = function() {
                const modal = document.getElementById('watchlist-modal');
                if (!modal) return;
                
                window.refreshWatchlistModal();
                modal.style.display = 'flex';
            };

            window.refreshWatchlistModal = function() {
                const content = document.getElementById('watchlist-modal-content');
                if (!content) return;
                
                const watched = JSON.parse(localStorage.getItem('gw2_watched_clears') || '[]');
                const clearsStatus = JSON.parse(localStorage.getItem('gw2_clears_status') || '{}');
                
                if (watched.length === 0) {
                    content.innerHTML = '<div style="font-size:11px; color:var(--text-muted, #8a7a5f); padding: 30px; text-align:center; letter-spacing: 1px;">No items on your watchlist.<br><br>Click the X-Ray icons next to items to watch them.</div>';
                } else {
                    let html = '';
                    watched.forEach(id => {
                        const status = clearsStatus[id];
                        if (status) {
                            let statusText = status.isDone ? 'CLEARED' : 'UNCLEARED';
                            if (status.progress !== undefined && status.max !== undefined) {
                                statusText = status.isDone ? 'CLEARED' : `${status.progress}/${status.max}`;
                            }
                            html += `
                            <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${status.name}' }, '*')">
                                <div class="clear-item-left">
                                    <span class="star-btn active" onclick="toggleWatch(event, '${id}', '${status.name}', '${status.cat}'); setTimeout(refreshWatchlistModal, 50);"></span>
                                    <span class="clear-name">${status.name} (${status.cat})</span>
                                </div>
                                <span class="clear-status ${status.isDone ? 'status-done' : 'status-uncleared'}">${statusText}</span>
                            </div>`;
                        }
                    });
                    content.innerHTML = html;
                }
            };
            
            window.closeWatchlistModal = function() {
                const modal = document.getElementById('watchlist-modal');
                if (modal) modal.style.display = 'none';
                init(true); // refresh main view to update stars and watchlist state
            };

            window.toggleWatchlistOnScreen = function(checked) {
                localStorage.setItem('gw2_clears_watchlist_visible', checked ? 'true' : 'false');
                window.parent.postMessage({ action: 'refreshClearsWatchlist' }, '*');
            };

            window.toggleCat = function(header, key) {
                const content = header.nextElementSibling;
                const isClosed = content.style.display === 'none';
                content.style.display = isClosed ? 'flex' : 'none';
                
                const saved = JSON.parse(localStorage.getItem('gw2_clears_menu_states') || '{}');
                saved[key] = isClosed; // true if open, false if closed
                localStorage.setItem('gw2_clears_menu_states', JSON.stringify(saved));
            };

            async function init(isAutoRefresh = false) {
                const settings = JSON.parse(localStorage.getItem('gw2_settings') || '{}');
                if (settings.uiScaleLarge) document.body.classList.add('ui-large');
                
                const isWatchlistVisible = localStorage.getItem('gw2_clears_watchlist_visible') === 'true';
                const toggleBtn = document.getElementById('clears-watchlist-toggle');
                if (toggleBtn) {
                    toggleBtn.checked = isWatchlistVisible;
                }

                if (!activeKey) return;

                // Load menu states from localStorage
                const menuStates = JSON.parse(localStorage.getItem('gw2_clears_menu_states') || '{}');

                if (!isAutoRefresh) {
                    document.getElementById('loader').style.display = 'flex';
                    document.getElementById('ui-root').style.display = 'none';
                    const container = document.getElementById('clears-container');
                    container.innerHTML = '';
                }

                const [allRaids, accRaids, accStrikes, allDungeons, accDungeons, accAchievements] = await Promise.all([
                    fetchJSON('https://api.guildwars2.com/v2/raids?ids=all'),
                    fetchJSON(`https://api.guildwars2.com/v2/account/raids?access_token=${activeKey}`),
                    fetchJSON(`https://api.guildwars2.com/v2/account/strikes?access_token=${activeKey}`),
                    fetchJSON('https://api.guildwars2.com/v2/dungeons?ids=all'),
                    fetchJSON(`https://api.guildwars2.com/v2/account/dungeons?access_token=${activeKey}`),
                    fetchJSON(`https://api.guildwars2.com/v2/account/achievements?access_token=${activeKey}`)
                ]);

                let clearsStatus = {};
                let watched = JSON.parse(localStorage.getItem('gw2_watched_clears') || '[]');

                // RAIDS
                let raidsHtml = '';
                let wingNum = 1;
                if (allRaids) {
                    allRaids.forEach(r => {
                        r.wings.forEach(w => {
                            let wingCleared = 0;
                            let wingTotal = w.events.length;
                            let eventsHtml = '';
                            
                            w.events.forEach(e => {
                                const isDone = accRaids && accRaids.includes(e.id);
                                if (isDone) wingCleared++;
                                
                                const displayName = formatName(e.id);
                                clearsStatus[e.id] = { name: displayName, isDone: isDone, cat: 'RAIDS' };
                                const isWatched = watched.includes(e.id);

                                eventsHtml += `
                                <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${displayName}' }, '*')">
                                    <div class="clear-item-left">
                                        <span class="star-btn ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${e.id}', '${displayName}', 'RAIDS')"></span>
                                        <span class="clear-name">${displayName}</span>
                                    </div>
                                    <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${isDone ? 'CLEARED' : 'UNCLEARED'}</span>
                                </div>`;
                            });

                            let progressHtml = wingCleared === wingTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${wingCleared}/${wingTotal}</span>`;

                            const subTitle = `Wing ${wingNum}: ${formatName(w.id)}`;
                            const isSubOpen = menuStates['sub_' + subTitle.trim()] === true; // default to closed (false)

                            raidsHtml += `
                            <div class="sub-cat">
                                <div class="sub-header" onclick="toggleCat(this, 'sub_${subTitle.replace(/'/g, "\\'")}')">
                                    <span class="sub-title">${subTitle}</span>
                                    ${progressHtml}
                                </div>
                                <div class="cat-content" style="${isSubOpen ? 'display:flex;' : 'display:none;'} padding:0; gap:0;">
                                    ${eventsHtml}
                                </div>
                            </div>`;
                            wingNum++;
                        });
                    });
                }
                
                const isRaidsOpen = menuStates['cat_RAIDS'] !== false; // default to open (true)
                let combinedHtml = `
                <div class="clear-cat">
                    <div class="cat-header" onclick="toggleCat(this, 'cat_RAIDS')"><span class="cat-title">RAIDS</span></div>
                    <div class="cat-content" style="padding:10px;${isRaidsOpen ? '' : ' display:none;'}">${raidsHtml || '<div style="font-size:11px; color:#8a7a5f;">Failed to load raids.</div>'}</div>
                </div>`;

                // STRIKES
                const strikeCats = {
                    "Icebrood Saga": ["shiverpeaks_pass", "voice_and_claw", "fraenir_of_jormag", "boneskinner", "whisper_of_jormag", "cold_war"],
                    "End of Dragons": ["aetherblade_hideout", "xunlai_jade_junkyard", "kaineng_overlook", "harvest_temple", "old_lions_court"],
                    "Secrets of the Obscure": ["cosmic_observatory", "temple_of_febe"]
                };
                
                let strikesHtml = '';
                for (const [catName, strikes] of Object.entries(strikeCats)) {
                    let catCleared = 0;
                    let catTotal = strikes.length;
                    let sHtml = '';
                    
                    strikes.forEach(s => {
                        const isDone = accStrikes && accStrikes.includes(s);
                        if (isDone) catCleared++;

                        const displayName = formatName(s);
                        clearsStatus[s] = { name: displayName, isDone: isDone, cat: 'STRIKES' };
                        const isWatched = watched.includes(s);

                        sHtml += `
                        <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${displayName}' }, '*')">
                            <div class="clear-item-left">
                                <span class="star-btn ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${s}', '${displayName}', 'STRIKES')"></span>
                                <span class="clear-name">${displayName}</span>
                            </div>
                            <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${isDone ? 'CLEARED' : 'UNCLEARED'}</span>
                        </div>`;
                    });

                    let progressHtml = catCleared === catTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${catCleared}/${catTotal}</span>`;

                    const isSubOpen = menuStates['sub_' + catName.trim()] === true; // default to closed (false)
                    strikesHtml += `
                    <div class="sub-cat">
                        <div class="sub-header" onclick="toggleCat(this, 'sub_${catName.replace(/'/g, "\\'")}')">
                            <span class="sub-title">${catName}</span>
                            ${progressHtml}
                        </div>
                        <div class="cat-content" style="${isSubOpen ? 'display:flex;' : 'display:none;'} padding:0; gap:0;">
                            ${sHtml}
                        </div>
                    </div>`;
                }

                const isStrikesOpen = menuStates['cat_STRIKES'] !== false; // default to open (true)
                combinedHtml += `
                <div class="clear-cat">
                    <div class="cat-header" onclick="toggleCat(this, 'cat_STRIKES')"><span class="cat-title">STRIKE MISSIONS</span></div>
                    <div class="cat-content" style="padding:10px;${isStrikesOpen ? '' : ' display:none;'}">${strikesHtml}</div>
                </div>`;

                // DUNGEONS
                let dungeonsHtml = '';
                if (allDungeons) {
                    allDungeons.forEach(d => {
                        let dCleared = 0;
                        let dTotal = d.paths.length;
                        let pHtml = '';

                        d.paths.forEach(p => {
                            const isDone = accDungeons && accDungeons.includes(p.id);
                            if (isDone) dCleared++;
                            
                            let pathName = '';
                            let dName = formatName(d.id);
                            if (p.type === 'Story') pathName = dName + ' Story';
                            else {
                                let pNum = p.id.match(/\d+$/);
                                if (pNum) pathName = dName + ' Path ' + pNum[0];
                                else pathName = formatName(p.id);
                            }

                            clearsStatus[p.id] = { name: pathName, isDone: isDone, cat: 'DUNGEONS' };
                            const isWatched = watched.includes(p.id);

                            pHtml += `
                            <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${pathName}' }, '*')">
                                <div class="clear-item-left">
                                    <span class="star-btn ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${p.id}', '${pathName}', 'DUNGEONS')"></span>
                                    <span class="clear-name">${pathName}</span>
                                </div>
                                <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${isDone ? 'CLEARED' : 'UNCLEARED'}</span>
                            </div>`;
                        });

                        let progressHtml = dCleared === dTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${dCleared}/${dTotal}</span>`;

                        const subTitle = formatName(d.id);
                        const isSubOpen = menuStates['sub_' + subTitle.trim()] === true; // default to closed (false)
                        dungeonsHtml += `
                        <div class="sub-cat">
                            <div class="sub-header" onclick="toggleCat(this, 'sub_${subTitle.replace(/'/g, "\\'")}')">
                                <span class="sub-title">${subTitle}</span>
                                ${progressHtml}
                            </div>
                            <div class="cat-content" style="${isSubOpen ? 'display:flex;' : 'display:none;'} padding:0; gap:0;">
                                ${pHtml}
                            </div>
                        </div>`;
                    });
                }

                const isDungeonsOpen = menuStates['cat_DUNGEONS'] !== false; // default to open (true)
                combinedHtml += `
                <div class="clear-cat">
                    <div class="cat-header" onclick="toggleCat(this, 'cat_DUNGEONS')"><span class="cat-title">DUNGEONS</span></div>
                    <div class="cat-content" style="padding:10px;${isDungeonsOpen ? '' : ' display:none;'}">${dungeonsHtml || '<div style="font-size:11px; color:#8a7a5f;">Failed to load dungeons.</div>'}</div>
                </div>`;

                // CONVERGENCE
                const CONVERGENCE_ITEMS = [
                    { name: "Mount Balrior", id: 8448 },
                    { name: "Outer Nyos", id: 7706 }
                ];

                let convCleared = 0;
                let convTotal = CONVERGENCE_ITEMS.length;
                let convHtml = '';
                
                CONVERGENCE_ITEMS.forEach(m => {
                    const playerProg = accAchievements ? accAchievements.find(a => a.id === m.id) : null;
                    const isDone = playerProg ? playerProg.done : false;
                    if (isDone) convCleared++;
                    
                    const progressCount = playerProg ? playerProg.current : 0;
                    const maxCount = playerProg ? playerProg.max : 3;
                    const statusText = isDone ? 'CLEARED' : `${progressCount}/${maxCount}`;
                    
                    clearsStatus[m.id] = { name: m.name, isDone: isDone, cat: 'CONVERGENCE', progress: progressCount, max: maxCount };
                    const isWatched = watched.includes(String(m.id));

                    convHtml += `
                    <div class="clear-item" onclick="window.parent.postMessage({ action: 'openWiki', title: '${m.name}' }, '*')">
                        <div class="clear-item-left">
                            <span class="star-btn ${isWatched ? 'active' : ''}" onclick="toggleWatch(event, '${m.id}', '${m.name}', 'CONVERGENCE')"></span>
                            <span class="clear-name">${m.name}</span>
                        </div>
                        <span class="clear-status ${isDone ? 'status-done' : 'status-uncleared'}">${statusText}</span>
                    </div>`;
                });

                let convProgressHtml = convCleared === convTotal ? `<span class="progress-done">✔</span>` : `<span class="progress-text">${convCleared}/${convTotal}</span>`;

                const convSubTitle = `Weekly Convergences`;
                const isConvSubOpen = menuStates['sub_' + convSubTitle.trim()] === true; // default to closed (false)
                
                let convergenceCatHtml = `

                function getWeeklyRotationWeekIndex() {
                    const epoch = Date.UTC(2023, 10, 6, 7, 30, 0); // Monday Nov 6, 2023 07:30 UTC

                    const elapsedWeeks = (now - epoch) / (7 * 24 * 60 * 60 * 1000);

                riftsHtml += `

                        ${rotatingHtml}
                    </div>

                let jwCleared = 0;

                const voeSubTitle = `Visions of Eternity`;
                const isVoeSubOpen = menuStates['sub_' + voeSubTitle.trim()] === true; // default to closed (false)
                riftsHtml += `
                <div class="sub-cat">
                    <div class="sub-header" onclick="toggleCat(this, 'sub_${voeSubTitle.replace(/'/g, "\\'")}')">

                combinedHtml += `

                </div>`;

                // Save dynamic API state into local storage to support the parent overlay
                localStorage.setItem('gw2_clears_status', JSON.stringify(clearsStatus));
                window.parent.postMessage({ action: 'refreshClearsWatchlist' }, '*');

                const container = document.getElementById('clears-container');
                container.innerHTML = combinedHtml;

                // Refresh watchlist modal if it's currently open
                const modal = document.getElementById('watchlist-modal');
                if (modal && modal.style.display === 'flex') {
                    window.refreshWatchlistModal();
                }

                if (!isAutoRefresh) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('ui-root').style.display = 'flex';
                }
            }

            window.addEventListener('message', (e) => { 
                if (e.data && e.data.action === 'switchAccount') { activeKey = e.data.apiKey; init(); } 
                if (e.data && e.data.action === 'uiScaleChanged') {
                    if (e.data.value === 'large') document.body.classList.add('ui-large');
                    else document.body.classList.remove('ui-large');
                }
                if (e.data && e.data.action === 'updateTheme') {
                    document.body.setAttribute('data-theme', e.data.theme);
                }
                if (e.data && e.data.action === 'clearsWatchlistClosed') {
                    // Update star displays to reflect closing/unwatching
                    init(true);
                }
            });

            function getNextWeeklyReset() {
                const now = new Date();
                const reset = new Date();
                reset.setUTCHours(7, 30, 0, 0);
                
                const day = now.getUTCDay();
                let daysToMonday = (1 - day + 7) % 7;
                if (daysToMonday === 0 && (now.getUTCHours() > 7 || (now.getUTCHours() === 7 && now.getUTCMinutes() >= 30))) {
                    daysToMonday = 7;
                }
                reset.setUTCDate(now.getUTCDate() + daysToMonday);
                return reset;
            }

            let nextResetTime = getNextWeeklyReset().getTime();
            setInterval(() => {
                if (Date.now() >= nextResetTime) {
                    nextResetTime = getNextWeeklyReset().getTime();
                    init();
                }
            }, 60000); // Check reset every minute

            // Auto-refresh the clears data in background every minute while the document is active
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    init(true);
                }
            }, 60000);

            init();
